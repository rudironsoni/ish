id: SYS-001
phase: 06-syscalls-core-fs-net

structural_expectations:
  exit_code: 0
  artifact_presence:
    - report.json
    - syscall_log.json

artifact_schema:
  report.json:
    required_fields:
      - case_id
      - phase
      - harness
      - passed
      - artifacts
      - timestamp
    passed_value: true

  syscall_log.json:
    required_fields:
      - case_id
      - syscall_count
      - log
    syscall_count_min: 4
    expected_syscalls:
      - write
      - read
      - close

semantic_expectations:
  test_results:
    write_stdout: passed
    write_file: passed
    read_file: passed
    close_fd: passed
    fd_invalidated: passed
  syscall_behavior:
    read_returns_bytes: true
    write_outputs_data: true
    close_returns_zero: true
    fd_invalidated_after_close: true
