id: SYS-011
phase: 06-syscalls-core-fs-net

structural_expectations:
  exit_code: 0
  artifact_presence:
    - report.json
    - syscall_log.json

artifact_schema:
  report.json:
    required_fields:
      - case_id
      - phase
      - harness
      - passed
      - artifacts
      - timestamp
    passed_value: true

  syscall_log.json:
    required_fields:
      - case_id
      - syscall_count
      - log
    expected_syscalls:
      - send
      - recv
      - sendmsg
      - recvmsg

semantic_expectations:
  test_results:
    send_transmits_data: passed
    recv_receives_data: passed
    sendmsg_transmits_data: passed
    recvmsg_receives_data: passed
  syscall_behavior:
    send_transmits_data: true
    recv_receives_data: true
    sendto_sends_with_address: true
    recvfrom_receives_with_address: true
    sendmsg_sends_with_control: true
    recvmsg_receives_with_control: true
