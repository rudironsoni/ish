id: SYS-004
phase: 06-syscalls-core-fs-net

structural_expectations:
  exit_code: 0
  artifact_presence:
    - report.json
    - syscall_log.json

artifact_schema:
  report.json:
    required_fields:
      - case_id
      - phase
      - harness
      - passed
      - artifacts
      - timestamp
    passed_value: true

  syscall_log.json:
    required_fields:
      - case_id
      - syscall_count
      - log
    expected_syscalls:
      - mmap
      - munmap
      - mprotect

semantic_expectations:
  test_results:
    mmap_anonymous: passed
    memory_access: passed
    mprotect_readonly: passed
    munmap_release: passed
  syscall_behavior:
    mmap_returns_valid_address: true
    memory_is_readable_writable: true
    munmap_releases_memory: true
    mprotect_changes_permissions: true
