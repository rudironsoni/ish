id: SYS-002
phase: 06-syscalls-core-fs-net

semantic_authority:
  source: linux-aarch64-abi
  reference: Linux kernel source - fs/open.c, fs/stat.c, fs/read_write.c
  syscall_numbers:
    openat: 56
    fstat: 80
    lseek: 62
  abi_conformance: aarch64-linux-gnu

decode_authority:
  instruction_type: svc
  syscall_classes:
    - file_operations
    - file_metadata

toolchain_notes:
  host_requirements:
    - POSIX-compliant operating system
    - AT_FDCWD support for openat
  cross_platform: true

known_gaps:
  - name: emulation_validation
    description: These tests validate host syscall behavior, not iSH emulation
    status: harness_runs_host_tests

non_authoritative_fields:
  - timestamp
  - specific_fd_numbers
  - exact_inode_numbers
