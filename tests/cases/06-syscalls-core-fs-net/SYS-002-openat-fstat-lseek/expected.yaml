id: SYS-002
phase: 06-syscalls-core-fs-net

structural_expectations:
  exit_code: 0
  artifact_presence:
    - report.json
    - syscall_log.json

artifact_schema:
  report.json:
    required_fields:
      - case_id
      - phase
      - harness
      - passed
      - artifacts
      - timestamp
    passed_value: true

  syscall_log.json:
    required_fields:
      - case_id
      - syscall_count
      - log
    syscall_count_min: 4
    expected_syscalls:
      - openat
      - fstat
      - lseek

semantic_expectations:
  test_results:
    openat_valid_fd: passed
    fstat_metadata: passed
    lseek_seek_set: passed
    lseek_seek_cur: passed
    lseek_seek_end: passed
  syscall_behavior:
    openat_returns_valid_fd: true
    fstat_returns_correct_size: true
    lseek_positions_correctly: true
