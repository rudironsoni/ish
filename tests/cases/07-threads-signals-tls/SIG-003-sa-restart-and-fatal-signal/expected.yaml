case_id: SIG-003
phase: 07-threads-signals-tls
description: SA_RESTART flag and fatal signal handling work correctly

expected_behavior:
  - SA_RESTART flag allows automatic syscall restart
  - sigaction with SA_RESTART sets appropriate handler behavior
  - SIG_DFL restores default signal handling
  - SIG_IGN ignores signals
  - Ignored signals do not cause process termination
  - Alarm signals can interrupt system calls

