    required_fields:
      - case_id: "SIG-003"
      - phase: "07-threads-signals-tls"
      - harness: "thread_signal_fixture"
      - passed: true

  thread_log.json:
    schema: thread_log_v1
    required_events:
      - event: "sa_restart"
      - event: "sig_dfl"
      - event: "sig_ign"

success_criteria:
  - Harness exits with code 0
  - sigaction with SA_RESTART succeeds
  - Signal handler receives alarm signal
  - sigaction SIG_DFL succeeds
