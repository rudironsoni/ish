case_id: THR-006
authority_type: runtime_fixture

semantic_authority:
  source: ISO/IEC 9899:2018 (C11) and GCC extensions
  document: _Thread_local storage class specifier
  gcc_extension: __thread keyword
  reference: https://gcc.gnu.org/onlinedocs/gcc/Thread-Local.html

abi_authority:
  source: Linux AArch64 ABI
  tls_implementation: TPIDR_EL0 register
  tls_model: Initial Exec (IE) model
  access_method: TPIDR_EL0 + offset

expectation_source:
  - __thread variables are stored in thread-local storage
  - Each thread has independent copy of TLS variables
  - TLS is initialized before thread entry
  - Compiler generates code to access TLS via TPIDR_EL0

known_gaps:
  - Does not verify TPIDR_EL0 register directly
  - Does not test TLS variants (global-dynamic, local-dynamic)
  - Does not verify TLS layout alignment
  - Does not test TLS destructor functions

non_authoritative_fields:
  - Specific TLS memory layout
  - TLS segment size optimization
  - Dynamic TLS allocation for dlopen'd libraries
