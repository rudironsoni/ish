case_id: SIG-001
phase: 07-threads-signals-tls
description: Real-time signal action (sigaction) and signal masking (sigprocmask) work

expected_behavior:
  - sigaction installs signal handler with SA_SIGINFO flag
  - Signal handler receives siginfo_t and ucontext_t
  - sigprocmask blocks specified signals
  - Blocked signals are held pending
  - sigprocmask unblocking delivers pending signals
  - Signal handler executes when signal is unblocked

