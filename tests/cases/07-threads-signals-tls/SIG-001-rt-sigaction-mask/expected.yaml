  report.json:
    schema: case_report_v1
    required_fields:
      - case_id: "SIG-001"
      - phase: "07-threads-signals-tls"
      - harness: "thread_signal_fixture"
      - passed: true

  thread_log.json:
    schema: thread_log_v1
    required_events:
      - event: "sigaction_install"
      - event: "sigprocmask_block"
      - event: "sigprocmask_unblock"

success_criteria:
  - Harness exits with code 0
  - sigaction returns 0 (success)
  - sigprocmask block returns 0 (success)
  - Signal is not received while blocked
  - Signal is delivered after unblock
  - Signal handler receives valid siginfo
