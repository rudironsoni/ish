case_id: SIG-001
authority_type: runtime_fixture

semantic_authority:
  source: IEEE Std 1003.1-2017 (POSIX.1-2017)
  document: sigaction, sigprocmask specification
  url: https://pubs.opengroup.org/onlinepubs/9699919799/

abi_authority:
  source: Linux AArch64 Signal ABI
  signal_frame: ucontext_t structure on stack
  siginfo_t: Includes si_signo, si_code, si_value
  sigprocmask: Manages thread signal mask

expectation_source:
  - sigaction installs per-signal handlers
  - SA_SIGINFO flag enables 3-argument handler
  - sigprocmask blocks/unblocks signals atomically
  - Blocked signals are held pending
  - Unblocking delivers pending signals

known_gaps:
  - Does not verify all siginfo fields
  - Does not test real-time signals (SIGRTMIN+)
  - Does not verify alternate signal stack
  - Does not test SA_NODEFER, SA_RESETHAND

non_authoritative_fields:
  - Exact ucontext_t layout (platform-specific)
  - Signal delivery timing guarantees
  - Signal queue ordering for real-time signals
