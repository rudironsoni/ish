version: "2.0"

case_id: STAB-001
phase: 10-tooling-stability-ios

semantic_authority:
  source: stability-contract
  normative_reference: POSIX.1-2017 process model
  description: |
    Validates that repeated shell command execution does not leak
    resources (file descriptors, process table entries, memory).
    Important for long-running emulation sessions.

toolchain_notes:
  - Uses system() for shell execution
  - Tests 100 iterations to detect leaks
  - Monitors file descriptor limits
  - Validates resource cleanup

expected_behavior:
  - Executes 100 shell commands in loop
  - All commands return success
  - No file descriptor exhaustion
  - Stable execution throughout

known_gaps:
  - Does not measure actual memory usage
  - Limited to 100 iterations for test speed
  - Does not test complex pipelines

non_authoritative_fields:
  - Exact iteration count (100 is arbitrary)
  - Resource limit values (system-dependent)
