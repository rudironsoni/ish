version: "2.0"

case_id: TOOL-004
phase: 10-tooling-stability-ios

semantic_authority:
  source: posix-toolchain-contract
  normative_reference: POSIX.1-2017, GNU tar documentation
  description: |
    Validates that archive and compression tools are available.
    These tools are essential for packaging, distribution, and
    artifact handling in the build system.

toolchain_notes:
  - tar is required on all POSIX systems
  - gzip is standard compression
  - xz provides better compression
  - zstd is modern compression standard
  - bzip2 is legacy but still used

expected_behavior:
  - Detects tar availability (required)
  - Reports compression tool availability
  - Passes if tar is available

known_gaps:
  - Does not test actual archive creation/extraction
  - Does not verify compression format support
  - Does not test archive integrity

non_authoritative_fields:
  - Specific tool versions
  - Supported compression formats
  - Implementation details (GNU vs BSD tar)
