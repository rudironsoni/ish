version: "2.0"

case_id: IOS-001
phase: 10-tooling-stability-ios
title: iOS sandbox execution strategy works

artifacts:
  tooling_log.json:
    description: JSON log of tooling events
    schema: tooling_event_log
    required: true
  report.json:
    description: Test execution report
    schema: case_report
    required: true

success_conditions:
  structural:
    - harness exits 0
    - report.json exists and is valid JSON
    - tooling_log.json exists and is valid JSON
  semantic:
    - report.passed is true
    - execution environment validated
    - event log contains ios_sandbox_check event
    - process information captured correctly
