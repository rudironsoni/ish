version: "2.0"

case_id: TOOL-001
phase: 10-tooling-stability-ios

semantic_authority:
  source: posix-toolchain-contract
  normative_reference: POSIX.1-2017, Xcode/Clang toolchain
  description: |
    Validates that guest compilers (gcc, clang, or cross-compilers) are
    available in the build environment. This is essential for building
    guest binaries for the emulated environment.

toolchain_notes:
  - Native compilers (gcc, clang, cc) preferred for development
  - Cross-compilers (aarch64-linux-gnu-gcc, etc.) required for embedded
  - macOS Xcode toolchain provides clang as primary compiler
  - Linux environments typically provide gcc

expected_behavior:
  - Detects available compilers in PATH
  - Reports compiler versions when available
  - Validates cross-compiler presence for aarch64 targets
  - Passes if any compiler infrastructure is available

known_gaps:
  - Does not verify compiler functionality (just presence)
  - Does not test actual compilation
  - Cross-compiler detection is best-effort

non_authoritative_fields:
  - Specific compiler versions (informational only)
  - Path locations (system-dependent)
