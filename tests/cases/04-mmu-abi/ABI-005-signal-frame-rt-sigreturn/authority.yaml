semantic_authority:
  source: POSIX.1-2008 - sigaction(2), ucontext.h
  url: https://pubs.opengroup.org/onlinepubs/9699919799/

abi_authority:
  source: Linux AArch64 ABI
  signal_frame: sigcontext structure defined in kernel
  notes: |
    The kernel constructs a signal frame on the stack containing
    the ucontext_t structure with machine state. The rt_sigreturn
    syscall restores this context.

toolchain_notes:
  runtime_verification: |
    This case uses sigaction with SA_SIGINFO to receive
    signal context. Tests verify frame layout and handler
    invocation.

platform_notes:
  portable: |
    Uses POSIX signal handling which is portable across
    Unix-like systems. ucontext_t layout may vary.

known_gaps:
  - Exact sigcontext register layout not validated
  - rt_sigreturn syscall mechanism not directly tested
  - Alternate signal stack (sigaltstack) not tested

non_authoritative_fields:
  - Exact ucontext_t memory layout
  - Signal trampoline code details
