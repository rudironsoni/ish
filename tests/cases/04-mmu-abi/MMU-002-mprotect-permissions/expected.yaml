mprotect_requirements:
  operations:
    - operation: mmap with PROT_READ | PROT_WRITE
      expected_result: success
      validation: address is page-aligned and accessible

    - operation: mprotect to PROT_READ
      expected_result: success (returns 0)
      validation: reads succeed, writes would fault

    - operation: mprotect to PROT_NONE
      expected_result: success (returns 0)
      validation: neither reads nor writes allowed

  permission_states:
    - state: PROT_READ | PROT_WRITE
      read_allowed: true
      write_allowed: true
      exec_allowed: false

    - state: PROT_READ
      read_allowed: true
      write_allowed: false
      exec_allowed: false

    - state: PROT_NONE
      read_allowed: false
      write_allowed: false
      exec_allowed: false

invariants:
  - "mprotect returns 0 on success"
  - "permission changes are immediately visible to current process"
  - "page alignment is preserved across permission changes"

validation_checks:
  - name: mprotect_read_only
    assertion: "mprotect(addr, size, PROT_READ) == 0"
    critical: true

  - name: read_after_protect
    assertion: "read from PROT_READ page succeeds"
    critical: true

  - name: mprotect_none
    assertion: "mprotect(addr, size, PROT_NONE) == 0"
    critical: true

success_criteria:
  - all critical checks pass
  - permission transitions complete without error
  - no segmentation fault during valid operations
