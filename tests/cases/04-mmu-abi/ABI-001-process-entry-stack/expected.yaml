stack_requirements:
  alignment:
    - sp must be 16-byte aligned at entry

  layout:
    - address: "[sp]"
      content: argc (8 bytes)
      required: true
    
    - address: "[sp + 8]"
      content: argv[0] pointer
      required: true
    
    - address: "[sp + 8 + argc * 8]"
      content: null terminator for argv
      required: true
    
    - address: "follows argv"
      content: envp array
      required: true
    
    - address: "follows envp null"
      content: auxv array
      required: true
    
    - address: "auxv end"
      content: AT_NULL entry
      required: true

auxv_required_entries:
  - AT_NULL: 0
  - AT_PHDR: program header address
  - AT_PHNUM: number of program headers
  - AT_PAGESZ: page size (typically 4096)
  - AT_RANDOM: random 16 bytes
  - AT_EXECFN: path to executable
  - AT_ENTRY: entry point address

invariants:
  - "sp % 16 == 0"
  - "argc >= 0"
  - "argv[argc] == NULL"
  - "envp terminates with NULL"
  - "auxv terminates with AT_NULL"
  - "at least 6 required auxv entries present"

validation_checks:
  - name: sp_alignment
    assertion: "sp & 0xF == 0"
    critical: true
  
  - name: argc_present
    assertion: "argc read from [sp] >= 0"
    critical: true
  
  - name: argv_null_terminated
    assertion: "argv[argc] == NULL"
    critical: true
  
  - name: auxv_required_entries
    assertion: "all 6 required entries found"
    critical: true

success_criteria:
  - all critical checks pass
  - no stack corruption detected
  - no distro-specific workaround required
