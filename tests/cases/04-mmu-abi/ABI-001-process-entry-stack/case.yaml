id: ABI-001
phase: 04-mmu-abi
title: Linux AArch64 process-entry stack layout is correct
class: abi
kind: abi_fixture
harness: abi_fixture
meson_test: case:ABI-001

prerequisites:
  - EXEC-001

expectation_authority:
  semantic_source: linux-aarch64-abi
  primary_tool: runtime-fixture
  secondary_tool: null
  tertiary_tool: null

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - stack_dump.bin exists
    - auxv.json exists
  semantic:
    - stack layout matches Linux AArch64 ABI
    - required auxv entries present
    - sp 16-byte aligned
    - no process-entry corruption

allowed_patch_scope:
  - kernel/exec.c
  - kernel/aarch64/*
  - emu/aarch64/cpu.c
  - tests/cases/04-mmu-abi/ABI-001-process-entry-stack/*

regression_target:
  meson_test: case:ABI-001

trace_defaults:
  backend: ring
  level: 2
  events: fault,block.entry,block.exit,process.entry
  pc_range: null
  regs: [sp, x0, x1]
  dump_on: fault

informational_only: false
