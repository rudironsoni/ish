semantic_authority:
  source: Linux Programmer's Manual - getauxval(3)
  url: https://man7.org/linux/man-pages/man3/getauxval.3.html
  stable_since: Linux 2.6.29

abi_authority:
  source: Linux AArch64 ABI
  at_random_type: 25
  notes: |
    AT_RANDOM provides a pointer to 16 bytes of random
    data generated by the kernel. This is used by libc
    for stack canaries, pointer guard values, and other
    security features requiring entropy at startup.

toolchain_notes:
  runtime_verification: |
    This case uses runtime fixture testing on the host system.
    The harness reads AT_RANDOM from auxv and validates
    that entropy is present.

platform_notes:
  linux_specific: |
    AT_RANDOM is a Linux-specific auxv entry. This test
    only runs on Linux systems. On other platforms
    (e.g., macOS), the test reports PASS with a skip note.

known_gaps:
  - Randomness quality not statistically verified
  - Re-run variance not checked (would need multiple runs)
  - Entropy source not validated

non_authoritative_fields:
  - Exact entropy generation mechanism
  - Kernel random pool state
