tlb_invalidation_requirements:
  triggers:
    - trigger: mprotect changing permissions
      expected: TLB entries for range invalidated
    - trigger: munmap unmapping memory
      expected: TLB entries for range invalidated

  verification_method:
    - method: access page before permission change
    - method: change permissions via mprotect
    - method: verify new permissions take effect
    - method: restore original permissions
    - method: verify write access restored

invariants:
  - "permission changes take effect immediately"
  - "no stale TLB entries after mprotect/munmap"

validation_checks:
  - name: initial_access
    assertion: "page accessible with initial permissions"
    critical: true

  - name: mprotect_invalidates_tlb
    assertion: "mprotect triggers TLB invalidate"
    critical: true

  - name: permission_change_visible
    assertion: "new permissions visible immediately"
    critical: true

  - name: munmap_invalidates_tlb
    assertion: "munmap triggers TLB invalidate"
    critical: true

success_criteria:
  - TLB invalidation on permission changes
  - New permissions take effect immediately
  - No stale entries remain
