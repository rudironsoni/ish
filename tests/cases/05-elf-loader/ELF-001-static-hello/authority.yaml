semantic_authority:
  source: ELF Specification v1.2
  url: https://refspecs.linuxfoundation.org/elf/elf.pdf

abi_authority:
  source: Linux AArch64 ABI
  binary_type: static executable
  notes: |
    Static binaries contain all code needed for execution
    and do not require a dynamic interpreter. They must be
    loaded with PT_LOAD segments mapped at correct offsets.

toolchain_notes:
  build_command: |
    aarch64-linux-musl-gcc -static -o hello hello.c
  verification: |
    readelf -l hello | grep -q "INTERP" should fail (no interpreter)

known_gaps:
  - Actual binary execution requires iSH runtime
  - Cross-compilation toolchain setup needed

non_authoritative_fields:
  - Specific load addresses
  - Section layout details
