id: ELF-001
phase: 05-elf-loader
title: Static binary loads and executes to completion
class: elf
kind: runtime_trace
harness: runtime_trace
meson_test: case:ELF-001

prerequisites:
  - ABI-001

expectation_authority:
  semantic_source: elf-and-linux-abi
  primary_tool: runtime-trace
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - trace.ring exists (if tracing enabled)
  semantic:
    - binary loads without fault
    - reaches _start
    - executes to exit
    - exit code 0
    - no runtime faults

allowed_patch_scope:
  - kernel/exec.c
  - kernel/elf.c
  - emu/aarch64/*
  - tests/cases/05-elf-loader/ELF-001-static-hello/*

regression_target:
  meson_test: case:ELF-001

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, x2, x3, x4, sp]
  dump_on: fault

informational_only: false

repro:
  binary_type: static
  source: minimal_hello.c
  expected_exit_code: 0
  max_execution_time_ms: 5000
