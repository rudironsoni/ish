elf_loading_requirements:
  binary_type: dynamic
  architecture: aarch64

  loading_checks:
    - check: ELF header valid
      expected: magic bytes match 0x7f 'ELF'
    - check: Interpreter present
      expected: PT_INTERP segment exists

  execution_requirements:
    - stack layout preserved
    - auxv entries intact
    - AT_ENTRY points to binary
    - argc/argv/envp accessible

invariants:
  - "Stack layout conforms to Linux AArch64 ABI"
  - "auxv entries passed correctly to interpreter"
  - "AT_ENTRY specifies program entry point"

validation_checks:
  - name: stack_preserved
    assertion: "Stack layout preserved during handoff"
    critical: true

  - name: auxv_intact
    assertion: "auxv entries intact after handoff"
    critical: true

  - name: at_entry_valid
    assertion: "AT_ENTRY points to binary entry"
    critical: true

success_criteria:
  - Handoff completes successfully
  - Interpreter receives correct state
  - Program entry point reachable
