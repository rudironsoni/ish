elf_loading_requirements:
  binary_type: any
  architecture: aarch64

  loading_checks:
    - check: ELF header valid
      expected: magic bytes match 0x7f 'ELF'
    - check: Relocation support present
      expected: relocation sections or dynamic tags exist

  execution_requirements:
    - R_AARCH64_RELATIVE applied
    - R_AARCH64_GLOB_DAT applied
    - R_AARCH64_JUMP_SLOT applied
    - relocated addresses correct

invariants:
  - "R_AARCH64_RELATIVE relocations adjust for load address"
  - "GLOB_DAT and JUMP_SLOT resolve to correct symbols"

validation_checks:
  - name: relative_relocs
    assertion: "R_AARCH64_RELATIVE relocations supported"
    critical: true

  - name: glob_dat_relocs
    assertion: "R_AARCH64_GLOB_DAT relocations supported"
    critical: true

  - name: jump_slot_relocs
    assertion: "R_AARCH64_JUMP_SLOT relocations supported"
    critical: true

success_criteria:
  - ELF loads successfully
  - All relocations applied correctly
  - Runtime addresses valid
