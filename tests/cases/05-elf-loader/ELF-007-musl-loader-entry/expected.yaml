elf_loading_requirements:
  binary_type: dynamic
  architecture: aarch64
  loader: musl

  loading_checks:
    - check: ELF header valid
      expected: magic bytes match 0x7f 'ELF'
    - check: musl interpreter
      expected: PT_INTERP points to ld-musl

  execution_requirements:
    - musl loader executes
    - self-relocations applied
    - program headers parsed
    - transfers to program entry

invariants:
  - "musl loader performs self-relocation first"
  - "Program headers parsed to find loadable segments"
  - "Control transferred to program entry point"

validation_checks:
  - name: loader_executes
    assertion: "musl loader code executes"
    critical: true

  - name: self_relocs_applied
    assertion: "Loader self-relocations complete"
    critical: true

  - name: transfer_successful
    assertion: "Control transferred to program"
    critical: true

success_criteria:
  - musl loader initializes successfully
  - Self-relocations applied
  - Program executes
