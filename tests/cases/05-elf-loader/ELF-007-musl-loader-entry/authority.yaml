semantic_authority:
  source: musl libc source
  url: https://musl.libc.org/

abi_authority:
  source: Linux AArch64 ABI
  loader: musl
  notes: |
    musl dynamic loader (ld-musl-aarch64.so.1) entry point
    performs self-relocation, parses program headers, loads
    dependencies, and transfers control to program entry.
    musl uses a simpler design than glibc with fewer indirections.

toolchain_notes:
  build_command: |
    aarch64-linux-musl-gcc -o hello hello.c
  notes: |
    musl loader is integrated with libc (single file)
    Self-relocation is required before any global data access

known_gaps:
  - Actual musl loader execution requires iSH runtime
  - musl-specific behaviors not fully emulated

non_authoritative_fields:
  - Internal loader data structures
  - Specific relocation processing order
