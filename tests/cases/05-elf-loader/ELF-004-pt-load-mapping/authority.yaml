semantic_authority:
  source: ELF Specification v1.2
  url: https://refspecs.linuxfoundation.org/elf/elf.pdf

abi_authority:
  source: Linux AArch64 ABI
  notes: |
    PT_LOAD segments define loadable regions of the binary.
    Each segment has file offset, virtual address, memory size,
    file size, and permission flags (PF_R, PF_W, PF_X).
    The kernel maps these with appropriate permissions.

toolchain_notes:
  verification: |
    readelf -l <binary> shows PT_LOAD segments
    Check flags: R = 4, W = 2, X = 1

known_gaps:
  - Actual memory mapping requires iSH runtime
  - Permission enforcement depends on MMU implementation

non_authoritative_fields:
  - Specific virtual addresses
  - Alignment details beyond page boundary
