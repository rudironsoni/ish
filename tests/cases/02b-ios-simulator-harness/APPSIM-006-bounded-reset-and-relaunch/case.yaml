id: APPSIM-006
phase: 02b-ios-simulator-harness
title: Bounded Reset and Relaunch
class: app_harness_capability
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APPSIM-006
prerequisites:
  - APPSIM-003
  - APPSIM-005
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: ios-sandbox-contract
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "Simulator reset (erase) is performed"
    - "Simulator re-boats after reset"
    - "App relaunch succeeds after reset"
    - "Retry count is tracked and bounded"
  semantic:
    - "Reset produces clean simulator state"
    - "Relaunch succeeds after reset"
    - "Retry does not exceed max_retries policy"

allowed_patch_scope:
  - "tests/cases/02b-ios-simulator-harness/APPSIM-006*/**"
  - "tests/cases/harness/ios_app_harness.c"
  - "tests/cases/harness/self_healing_runner.c"

regression_target:
  meson_test: case:APPSIM-006

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 300
  alive_check_interval: 5
  max_alive_wait: 60

required_artifacts:
  - name: reset_result.json
    type: json
    description: Simulator erase and reset result
  - name: relaunch_result.json
    type: json
    description: App relaunch after reset result
  - name: retry_log.json
    type: json
    description: Retry attempts and outcomes
  - name: report.json
    type: json
    description: Case execution report

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Proves bounded reset/relaunch works for self-healing"
