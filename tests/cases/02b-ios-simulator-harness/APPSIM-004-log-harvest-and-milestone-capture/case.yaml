id: APPSIM-004
phase: 02b-ios-simulator-harness
title: Log Harvest and Boot Milestone Capture
class: app_harness_capability
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APPSIM-004
prerequisites:
  - APPSIM-003
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: ios-sandbox-contract
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "Simulator logs are captured"
    - "App boot milestones are extracted from logs"
    - "Milestone ordering is valid"
  semantic:
    - "Log capture includes app launch window"
    - "At least one milestone is identified"
    - "Milestone timestamps or offsets are recorded"

allowed_patch_scope:
  - "tests/cases/02b-ios-simulator-harness/APPSIM-004*/**"
  - "tests/cases/harness/ios_app_harness.c"
  - "tests/cases/harness/boot_milestone_extractor.c"

regression_target:
  meson_test: case:APPSIM-004

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: false
  reset_on_retry: false

timeout_policy:
  launch_timeout: 180
  alive_check_interval: 5
  max_alive_wait: 30

required_artifacts:
  - name: sim_launch.json
    type: json
    description: Launch metadata
  - name: simulator_log_tail.txt
    type: text
    description: Captured simulator log output
  - name: boot_milestones.json
    type: json
    description: Extracted boot milestones with ordering
  - name: report.json
    type: json
    description: Case execution report

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Proves log harvesting and milestone extraction works"
