vectors:
  # Unconditional branch immediate
  - name: b_imm_0x100
    asm: "b #0x100"
    encoding_hex_le: "40000014"
    canonical_disasm: "b #256"
    expected_decode:
      category: 10  # A64_BRANCH
      subtype: 1  # Unconditional branch (immediate)
      target: 256  # Sign-extended imm26 << 2
      set_flags: false

  - name: bl_imm_0x200
    asm: "bl #0x200"
    encoding_hex_le: "80000094"
    canonical_disasm: "bl #512"
    expected_decode:
      category: 10
      subtype: 1
      target: 512
      set_flags: false

  # Unconditional branch register
  - name: br_x0
    asm: "br x0"
    encoding_hex_le: "00001fd6"
    canonical_disasm: "br x0"
    expected_decode:
      category: 11  # A64_BRANCH2
      subtype: 5  # Unconditional branch (register)
      rn: 0  # Register holding target address
      set_flags: false

  - name: blr_x1
    asm: "blr x1"
    encoding_hex_le: "20003fd6"
    canonical_disasm: "blr x1"
    expected_decode:
      category: 11
      subtype: 5
      rn: 1
      set_flags: false

  - name: ret
    asm: "ret"
    encoding_hex_le: "c0035fd6"
    canonical_disasm: "ret"
    expected_decode:
      category: 11
      subtype: 5
      rn: 30  # x30 (link register)
      set_flags: false

success_threshold: 5
