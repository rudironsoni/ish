    asm: "add x0, x1, x2"
    encoding_hex_le: "2000028b"
    canonical_disasm: "add x0, x1, x2"
    expected_decode:
      category: 5  # A64_DP_REG2
      subtype: 0  # ADD (op=0)
      rd: 0
      rn: 1
      rm: 2
      shift_type: 0  # LSL
      shift_amount: 0
      set_flags: false

  - name: sub_x3_x4_x5_lsl3
