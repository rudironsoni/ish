id: DEC-001
phase: 01-decode
title: Decode ADD/SUB immediate encodings correctly
class: decode
kind: decode_golden
harness: decode_golden
meson_test: case:DEC-001

prerequisites:
  - TRACE-001

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - decoded.json exists
  semantic:
    - decoded fields match expected values
    - canonical disassembly matches expectation
    - all vectors pass

allowed_patch_scope:
  - emu/aarch64/decode.c
  - tests/cases/01-decode/DEC-001-addsub-immediate/*

regression_target:
  meson_test: case:DEC-001

trace_defaults:
  backend: nop
  level: 0
  events: ""
  pc_range: null
  regs: []
  dump_on: none

informational_only: false
