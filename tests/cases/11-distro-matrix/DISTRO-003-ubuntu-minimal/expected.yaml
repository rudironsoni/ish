case_id: DISTRO-003
phase: 11-distro-matrix
description: Ubuntu minimal system boots and runs basic commands

expected_behavior:
  - Ubuntu Linux base system is detected
  - glibc runtime is identified
  - Basic shell commands execute successfully
  - System information can be retrieved
  - Package manager (apt) is available and responsive

expected_artifacts:
  report.json:
    schema: case_report_v1
    required_fields:
      - case_id: "DISTRO-003"
      - phase: "11-distro-matrix"
      - harness: "distro_fixture"
      - passed: true
      - artifacts: ["distro_info.json", "report.json"]

  distro_info.json:
    schema: distro_info_v1
    required_fields:
      - distro_name: "Ubuntu"
      - libc_type: "glibc"
      - package_manager: "apt"

success_criteria:
  - Harness exits with code 0
  - report.json indicates passed: true
  - distro_info.json contains valid Ubuntu identification
  - System is recognized as glibc-based
