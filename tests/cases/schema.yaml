version: "2"

schema_documentation: |
  This schema defines the canonical structure for all test cases in the
  tests/cases/ system. Every case directory MUST contain a case.yaml file
  conforming to this schema.
  
  The schema supports autonomous agent operation for multi-phase validation.

required_fields:
  - id
  - phase
  - title
  - class
  - kind
  - harness
  - meson_test
  - prerequisites
  - expectation_authority
  - success_criteria
  - allowed_patch_scope
  - regression_target

field_definitions:

  id:
    type: string
    pattern: "^[A-Z]{2,6}-[0-9]{3}$"
    description: "Unique case identifier. Format: PREFIX-NNN."
    examples:
      - TRACE-001
      - DEC-001
      - GEN-001
      - EXEC-001
      - ABI-001
      - ELF-001
      - SYS-001
      - THR-001
      - SIG-001
      - MUSL-001
      - GLIBC-001
      - TOOL-001
      - STAB-001
      - IOS-001
      - DISTRO-001

  phase:
    type: string
    pattern: "^[0-9]{2}-[a-z0-9-]+$"
    description: "Phase directory name. Format: NN-name."
    valid_phases:
      - 00-trace-harness
      - 01-decode
      - 02-generator
      - 03-semantic-exec
      - 04-mmu-abi
      - 05-elf-loader
      - 06-syscalls-core-fs-net
      - 07-threads-signals-tls
      - 08-musl
      - 09-glibc
      - 10-tooling-stability-ios
      - 11-distro-matrix

  title:
    type: string
    min_length: 10
    max_length: 120
    description: Human-readable case description.

  class:
    type: enum
    values:
      - trace
      - decode
      - generator
      - semantic
      - mmu
      - abi
      - elf
      - syscall
      - thread
      - signal
      - musl
      - glibc
      - distro
      - ios
      - stability
      - tooling

  kind:
    type: enum
    values:
      - decode_golden
      - generator_golden
      - semantic_micro
      - abi_fixture
      - runtime_trace
      - elf_fixture
      - syscall_fixture
      - thread_fixture
      - signal_fixture
      - distro_fixture
      - ios_fixture

  harness:
    type: enum
    values:
      - decode_golden
      - generator_golden
      - semantic_micro
      - abi_fixture
      - runtime_trace
      - elf_fixture
      - syscall_fixture
      - thread_fixture
      - signal_fixture
      - distro_fixture
      - ios_fixture

  meson_test:
    type: string
    pattern: "^case:[A-Z]{2,6}-[0-9]{3}$"
    description: "Full Meson test name. Format: case:ID."

  prerequisites:
    type: array
    items:
      type: string
    description: List of prerequisite case IDs.

  expectation_authority:
    type: object
    required_fields:
      - semantic_source
    properties:
      semantic_source:
        type: string
        enum:
          - arm-a64
          - linux-aarch64-abi
          - elf-and-linux-abi
          - internal-trace-contract
          - musl-libc-contract
          - glibc-contract
          - ios-sandbox-contract
      primary_tool:
        type: string
      secondary_tool:
        type: string
      tertiary_tool:
        type: string

  success_criteria:
    type: object
    properties:
      structural:
        type: array
        items:
          type: string
      semantic:
        type: array
        items:
          type: string

  allowed_patch_scope:
    type: array
    items:
      type: string
    description: Files or globs agent may modify.

  regression_target:
    type: object
    required_fields:
      - meson_test
    properties:
      meson_test:
        type: string

  # NEW: Status tracking for autonomous operation
  status:
    type: enum
    values:
      - REAL PASS
      - REAL FAIL
      - STUB
      - BLOCKED
      - INVALID
    description: |
      Current validation status of this case:
      - REAL PASS: Case executes and produces valid evidence matching expected.
      - REAL FAIL: Case executes but produces output that does not match expected.
      - STUB: Case directory exists but has no real implementation (scaffolded only).
      - BLOCKED: Case cannot execute because prerequisite case is not REAL PASS.
      - INVALID: Case contract is malformed or expectations are inconsistent.
    default: STUB

  # NEW: Gate case classification
  is_gate_case:
    type: boolean
    default: false
    description: |
      If true, this case is part of the gate for its phase.
      Gate cases MUST be REAL PASS before proceeding to the next phase.

  # NEW: Informational-only classification
  informational_only:
    type: boolean
    default: false
    description: |
      If true, case does not gate phase progression.
      Failure or incomplete status does not block next phase.

  # NEW: Required artifacts
  required_artifacts:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: enum
          values:
            - binary
            - text
            - json
            - yaml
            - trace
        description:
          type: string
        fixture_source:
          type: string
          description: Path or command to generate fixture (if applicable)
    description: Artifacts required for case execution and verification.

  # NEW: Trace configuration defaults
  trace_defaults:
    type: object
    properties:
      backend:
        type: string
        enum: [nop, ring, file]
      level:
        type: integer
        minimum: 0
        maximum: 5
      events:
        type: string
      pc_range:
        type: [string, "null"]
      regs:
        type: array
        items:
          type: string
      dump_on:
        type: string
        enum: [none, fault, syscall, always]

  # NEW: Case metadata
  metadata:
    type: object
    properties:
      created_date:
        type: string
        format: date
      last_modified:
        type: string
        format: date
      scaffolded:
        type: boolean
        default: true
        description: |
          If true, case exists as a scaffold only - contract is defined
          but implementation is not yet complete.
      implementation_ready:
        type: boolean
        default: false
        description: |
          If true, all prerequisites are satisfied and case is ready
          for implementation work.

file_requirements:
  decode_golden:
    required:
      - case.yaml
      - expected.yaml
      - authority.yaml
    fixtures:
      manifest_required: true

  generator_golden:
    required:
      - case.yaml
      - expected.yaml
      - authority.yaml
    fixtures:
      manifest_required: true

  semantic_micro:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

  abi_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

  runtime_trace:
    required:
      - case.yaml
    optional:
      - expected.yaml
    fixtures:
      manifest_required: false

  elf_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

  syscall_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

  thread_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

  signal_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

  distro_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: true

  ios_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
    fixtures:
      manifest_required: false

# NEW: Autonomous operation support
autonomous_operation:
  active_case_selection:
    description: |
      Algorithm for determining the active case:
      1. Read tests/cases/execution-order.yaml for phase order and gate inventory.
      2. Find earliest phase where not all gate cases have status "REAL PASS".
      3. Within that phase, find earliest gate case not "REAL PASS".
      4. That case becomes the ACTIVE CASE.
      5. Read case.yaml for the active case to determine prerequisites.
      6. If prerequisites are not satisfied, mark BLOCKED and repair dependencies.
      7. If case directory missing, scaffold it.
      8. If case contract invalid, repair before implementation.
    
  refusal_rules:
    - name: phase_skipping
      description: Never jump from phase N to phase N+M where M > 1.
      severity: FATAL
    
    - name: multi_case_repair
      description: Only one implementation-active case at a time.
      severity: FATAL
    
    - name: stub_as_pass
      description: Never treat STUB or scaffolded state as REAL PASS.
      severity: FATAL
    
    - name: broad_debugging
      description: If a smaller missing case can be created, create it first.
      severity: WARNING
    
    - name: edit_generated
      description: Modify source only, never edit generated artifacts directly.
      severity: FATAL

# NEW: Case counts by phase
case_inventory:
  total_phases: 12
  total_gate_cases: 108
  phases:
    00-trace-harness:
      gate_count: 6
      case_prefix: TRACE
    01-decode:
      gate_count: 11
      case_prefix: DEC
    02-generator:
      gate_count: 8
      case_prefix: GEN
    03-semantic-exec:
      gate_count: 10
      case_prefix: EXEC
    04-mmu-abi:
      gate_count: 11
      case_prefixes: [MMU, ABI]
    05-elf-loader:
      gate_count: 9
      case_prefix: ELF
    06-syscalls-core-fs-net:
      gate_count: 12
      case_prefix: SYS
    07-threads-signals-tls:
      gate_count: 9
      case_prefixes: [THR, SIG]
    08-musl:
      gate_count: 8
      case_prefix: MUSL
    09-glibc:
      gate_count: 10
      case_prefix: GLIBC
    10-tooling-stability-ios:
      gate_count: 10
      case_prefixes: [TOOL, STAB, IOS]
    11-distro-matrix:
      gate_count: 4
      case_prefix: DISTRO
