version: 1

schema_documentation: |
  This schema defines the canonical structure for all test cases in the
  tests/cases/ system. Every case directory MUST contain a case.yaml file
  conforming to this schema.

required_fields:
  - id
  - phase
  - title
  - class
  - kind
  - harness
  - meson_test
  - prerequisites
  - expectation_authority
  - success_criteria
  - allowed_patch_scope
  - regression_target

field_definitions:

  id:
    type: string
    pattern: "^[A-Z]{2,6}-[0-9]{3}$"
    description: "Unique case identifier. Format: PREFIX-NNN."

  phase:
    type: string
    pattern: "^[0-9]{2}-[a-z0-9-]+$"
    description: "Phase directory name. Format: NN-name."

  title:
    type: string
    min_length: 10
    max_length: 120
    description: Human-readable case description.

  class:
    type: enum
    values:
      - trace
      - decode
      - generator
      - semantic
      - mmu
      - abi
      - elf
      - syscall
      - thread
      - signal
      - musl
      - glibc
      - distro
      - ios
      - stability

  kind:
    type: enum
    values:
      - decode_golden
      - generator_golden
      - semantic_micro
      - abi_fixture
      - runtime_trace

  harness:
    type: enum
    values:
      - decode_golden
      - generator_golden
      - semantic_micro
      - abi_fixture
      - runtime_trace

  meson_test:
    type: string
    pattern: "^case:[A-Z]{2,6}-[0-9]{3}$"
    description: "Full Meson test name. Format: case:ID."

  prerequisites:
    type: array
    items:
      type: string
    description: List of prerequisite case IDs.

  expectation_authority:
    type: object
    required_fields:
      - semantic_source
    properties:
      semantic_source:
        type: string
        enum:
          - arm-a64
          - linux-aarch64-abi
          - elf-and-linux-abi
          - internal-trace-contract
      primary_tool:
        type: string
      secondary_tool:
        type: string
      tertiary_tool:
        type: string

  success_criteria:
    type: object
    properties:
      structural:
        type: array
        items:
          type: string
      semantic:
        type: array
        items:
          type: string

  allowed_patch_scope:
    type: array
    items:
      type: string
    description: Files or globs agent may modify.

  regression_target:
    type: object
    required_fields:
      - meson_test
    properties:
      meson_test:
        type: string

optional_fields:

  informational_only:
    type: boolean
    default: false
    description: If true, case does not gate phase progression.

  trace_defaults:
    type: object
    properties:
      backend:
        type: string
        enum: [nop, ring, file]
      level:
        type: integer
        minimum: 0
        maximum: 5
      events:
        type: string
      pc_range:
        type: [string, "null"]
      regs:
        type: array
        items:
          type: string
      dump_on:
        type: string
        enum: [none, fault, syscall, always]

file_requirements:
  decode_golden:
    required:
      - case.yaml
      - expected.yaml
      - authority.yaml
  generator_golden:
    required:
      - case.yaml
      - expected.yaml
      - authority.yaml
  semantic_micro:
    required:
      - case.yaml
    recommended:
      - expected.yaml
  abi_fixture:
    required:
      - case.yaml
    recommended:
      - expected.yaml
  runtime_trace:
    required:
      - case.yaml
    optional:
      - expected.yaml
