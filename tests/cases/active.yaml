# Active Case Lock
# Machine-readable single active case state
# Phase architecture revised - 02b and 02c inserted

version: "3.0"
last_updated: "2026-03-28T06:00:00Z"

# Migration Policy
# Handles stale active cases after phase inventory changes
migration_policy:
  version: "3.0"
  from_version: "2.2"
  
  stale_active_case_handler:
    condition: |
      active_case.phase not in ["00-trace-harness", "01-decode", "02-generator", 
                                "02b-ios-simulator-harness", "02c-ios-app-runtime-entry",
                                "03-semantic-exec", "04-mmu-abi", "05-elf-loader",
                                "06-syscalls-core-fs-net", "07-threads-signals-tls",
                                "08-musl", "09-glibc", "10-tooling-stability-ios",
                                "11-distro-matrix"] OR
      active_case.case_id in ["IOS-001", "IOS-002", "IOS-003"]
    action: |
      1. Clear active case lock (case_id: null, phase: null)
      2. Reset session state to INITIAL
      3. Log migration: "Active case reset due to phase inventory change"
      4. Trigger case-next to select lawful next case from new phase order
    auto_trigger: true

# Active case identification
active_case:
  case_id: null
  phase: null
  status_before: null
  status_after: null
  owner: "orchestrator"
  started_at: null
  completed_at: null
  migration_triggered: "2026-03-28T06:00:00Z"
  migration_reason: "Phase inventory changed - 02b and 02c inserted, IOS-001..003 deprecated"

# Current execution state
session_state:
  current_stage: "INITIAL"
  next_action: "case-next"
  case_just_promoted: false

# Continuation invariants
continuation_invariants:
  can_continue: true
  terminal_stop: false
  budget_remaining: 5
  stop_reason: null
  auto_continue: true
  next_action_valid: true
  continued_last_transition: false
  invariants_violated: false
  invalid_stop_detected: false

# Retry budget tracking
retry_budget:
  retry_budget_remaining: 3
  repair_attempts: 0
  last_error: null
  last_mismatch: null

# Patch scope enforcement
allowed_patch_scope:
  level: "none"
  allowed_paths: []
  forbidden_paths:
    - "tests/cases/00-trace-harness/**"
    - "tests/cases/01-decode/**"
    - "tests/cases/02-generator/**"

# Session budget
session_budget:
  max_cases_per_session: 6
  max_phase_progression: 1
  cases_processed: 0
  phases_completed: ["00-trace-harness", "01-decode", "02-generator"]

# Execution history
execution_log:
