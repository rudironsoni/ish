input_instruction:
  name: cmp_x0_imm1
  asm: "cmp x0, #1"
  encoding_hex_le: "1f0400f1"
  equivalent_subs: "subs xzr, x0, #1"

generator_expectation:
  architectural_effect:
    - "NZCV := flags(x0 - 1)"
    - "x0 unchanged"

  emitted_sequence:
    - gadget: load_guest_reg
      description: Load guest x0 from hot host register x1
      guest_src_reg: 0
      host_src: x1
      scratch: x14

    - gadget: sub_imm_flags
      description: Subtract immediate #1 and set NZCV flags
      imm: 1
      scratch: x14

    - gadget: store_nzcv
      description: Store flags to NZCV register in CPU state
      scratch: x14
      scratch2: x15

  register_allocation:
    guest_x0: host_x1
    scratch: host_x14
    scratch2: host_x15

  sidecar_metadata:
    instruction_count: 1
    gadget_count: 3
    has_branch: false
    writes_flags: true
    discard_result: true

success_criteria:
  - emitted_sequence produces correct NZCV flags
  - register_allocation uses hot register mapping
  - result discarded (destination is XZR)
  - sidecar_metadata valid
