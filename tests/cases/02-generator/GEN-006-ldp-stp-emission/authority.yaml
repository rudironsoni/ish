semantic_source:
  family: arm-a64
  reference_url: https://developer.arm.com/documentation/ddi0602/latest
  section: C6.2.126 (LDP), C6.2.262 (STP)
  notes: |
    Load/Store Pair (LDP/STP) encoding:
    - bit 31: opc[1] (with bit 30: size 00=32-bit, 01=64-bit, 10=128-bit SIMD)
    - bit 30: L (0=store STP, 1=load LDP)
    - bits 29:25: 10100 (0x14) - identifies load/store pair
    - bit 24: 0 (reserved)
    - bits 23:22: type (00=non-temporal, 01=offset, 10=post-index, 11=pre-index)
    - bit 21: 0 (reserved)
    - bits 20:15: imm7 (signed offset, scaled by 8 for 64-bit, 4 for 32-bit)
    - bits 14:10: Rt2 (second register)
    - bits 9:5: Rn (base register)
    - bits 4:0: Rt (first register)

    Addressing modes:
    - Offset: [base, #imm] - base unchanged
    - Post-index: [base], #imm - use base, then base += imm
    - Pre-index: [base, #imm]! - base += imm, then use base

    Scale factor:
    - 32-bit (W registers): imm7 << 2 (4-byte alignment)
    - 64-bit (X registers): imm7 << 3 (8-byte alignment)

encoding_source:
  tool: llvm-mc
  version: 22.1.1
  command: |
    llvm-mc --triple=aarch64-linux-gnu --show-encoding
  derived_encodings:
    # LDP/STP with 64-bit registers (opc=01, base opcode 0xA8/0xA9)
    ldp_x0_x1_sp: "e00b40a9"         # ldp x0, x1, [sp]: [0xe0,0x0b,0x40,0xa9]
    stp_x2_x3_sp_16: "e28f00a9"      # stp x2, x3, [sp, #16]: [0xe2,0x8f,0x00,0xa9]
    ldp_x4_x5_sp_post_16: "e48b40a8" # ldp x4, x5, [sp], #16: [0xe4,0x8b,0x40,0xa8]
    stp_x6_x7_sp_pre_16: "e68fc0a9"  # stp x6, x7, [sp, #16]!: [0xe6,0x8f,0xc0,0xa9]
    # LDP/STP with 32-bit registers (opc=00, base opcode 0x28/0x29)
    ldp_w8_w9_sp: "e80b4029"         # ldp w8, w9, [sp]: [0xe8,0x0b,0x40,0x29]
    stp_w10_w11_sp_8: "ea470029"     # stp w10, w11, [sp, #8]: [0xea,0x47,0x00,0x29]
    ldp_w12_w13_sp_post_8: "ec4b4028"# ldp w12, w13, [sp], #8: [0xec,0x4b,0x40,0x28]
    stp_w14_w15_sp_pre_8: "ee47c029" # stp w14, w15, [sp, #8]!: [0xee,0x47,0xc0,0x29]

decode_primary:
  tool: llvm-objdump
  version: 22.1.1

tools_agree: true
verification_date: "2026-03-27"
verified_by: agent
notes: |
  Eight test vectors covering:
  - LDP with 64-bit registers, offset mode
  - STP with 64-bit registers, offset mode
  - LDP with 64-bit registers, post-index mode
  - STP with 64-bit registers, pre-index mode
  - LDP with 32-bit registers, offset mode
  - STP with 32-bit registers, offset mode
  - LDP with 32-bit registers, post-index mode
  - STP with 32-bit registers, pre-index mode

  LDP/STP are commonly used for:
  - Function prologue/epilogue (saving/restoring registers)
  - Structure field loading
  - Efficient register pair operations

  The generator must handle:
  1. Base register (possibly SP) mapping to host
  2. Two target registers (may be hot or cold)
  3. Addressing mode (offset/post-index/pre-index)
  4. Proper alignment and scaling of immediate
