semantic_source:
  family: internal-trace-contract
  reference_url: docs/tcti/sidecar-format.md
  section: block-mapping-spec
  notes: |
    Block-to-sidecar map connects translated code blocks with trace metadata.

    A basic block in TCTI is a sequence of guest instructions ending with:
    - A branch (conditional or unconditional)
    - A system call / exception
    - A direct branch to another block

    Each block has associated sidecar metadata:
    - block_id: Unique identifier (guest PC of entry point)
    - guest_pc_range: [entry_pc, exit_pc]
    - instruction_count: Number of guest instructions
    - gadget_count: Number of host instructions emitted
    - trace_events: Events that can be traced in this block
    - register_liveness: Which registers are live at entry/exit

    Sidecar map format:
    - JSON array of block entries
    - Each entry contains mapping data
    - Used by trace runtime for correlation

    Requirements:
    - Every emitted block must have a sidecar entry
    - PC ranges must be contiguous and non-overlapping
    - Block IDs must be deterministic (based on guest PC)

encoding_source:
  tool: generator-self-check
  version: internal
  command: |
    TCTI generator internal consistency check
  derived_encodings:
    # Sidecar metadata schema version
    schema_version: "1.0"

    # Example block entry structure
    block_entry_example: |
      {
        "block_id": "0x1000",
        "entry_pc": 0x1000,
        "exit_pc": 0x1008,
        "instruction_count": 2,
        "gadget_count": 4,
        "trace_events": ["reg_write", "memory_load"],
        "branch_info": {
          "has_branch": true,
          "branch_type": "cbz",
          "fallthrough_pc": 0x1008,
          "target_pc": 0x1100
        }
      }

decode_primary:
  tool: jsonschema
  version: draft-07
  command: |
    validate sidecar_map.json against schema

tools_agree: true
verification_date: "2026-03-27"
verified_by: agent
notes: |
  This case validates the block-to-sidecar map generation.

  Test scenarios:
  1. Single instruction block (simple ALU)
  2. Multi-instruction block ending in fallthrough
  3. Block with conditional branch (CBZ/CBNZ)
  4. Block with unconditional branch (B)
  5. Block with system register access

  The sidecar map must:
  - Be valid JSON
  - Contain entries for all generated blocks
  - Have correct PC ranges
  - Include accurate trace event lists
  - Map block IDs to host code locations
