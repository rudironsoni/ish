version: 1

# Authority chain for TRACE-002-pc-filter expectations
# Defines where normative expectations come from

semantic_source: internal-trace-contract

authority_chain:
  tier_0:
    source: "internal-trace-contract"
    description: "Repository-internal trace subsystem contract"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      - "trace/*"
    
  tier_1:
    source: "harness-implementation"
    description: "Runtime trace harness reference implementation with PC filtering"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      
  tier_2:
    source: "case-contract"
    description: "This case's contract definition for PC filtering"
    documents:
      - "tests/cases/00-trace-harness/TRACE-002-pc-filter/case.yaml"

expectation_provenance:
  - expectation: "trace.ring exists with PC-filtered events"
    source: "harness-implementation"
    verification: "structural check"
    
  - expectation: "report.json includes pc_filter_config field"
    source: "harness-implementation"
    verification: "schema validation"
    
  - expectation: "only events within specified PC range are traced"
    source: "internal-trace-contract"
    verification: "semantic validation"
    
  - expectation: "events outside PC range are excluded from trace"
    source: "internal-trace-contract"
    verification: "semantic validation"

generation_method: |
  Expectations derived from harness implementation contract.
  Not from runtime behavior observation.
  
regeneration_steps: |
  1. Review harness implementation in tests/cases/harness/runtime_trace.c
  2. Verify PC range filtering logic and bounds checking
  3. Update expectations to match harness contract for PC filtering

