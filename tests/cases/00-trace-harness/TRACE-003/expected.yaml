version: 1

# Expected trace output for TRACE-003-register-filter

harness_exit_code: 0

required_artifacts:
  - name: trace.ring
    type: binary
    description: Ring buffer trace output
    min_size_bytes: 64
    
  - name: report.json
    type: json
    description: Harness execution report
    required_fields:
      - status
      - case_id
      - harness
      - exit_code
      - timestamp

structural_expectations:
  trace_ring:
    - must_exist: true
    - must_be_non_empty: true
    - must_contain_valid_headers: true
    
  report:
    status: "completed"
    exit_code: 0
    case_id: "TRACE-003"
    harness: "runtime_trace"

semantic_expectations:
  - trace_events_captured: true
  - trace_integrity_valid: true

