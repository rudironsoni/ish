version: 1

# Expected trace output for TRACE-006-offline-decode
# This defines the structural expectations for offline trace decoding

harness_exit_code: 0

required_artifacts:
  - name: trace.ring
    type: binary
    description: Ring buffer trace output for offline decoding
    min_size_bytes: 64
    
  - name: report.json
    type: json
    description: Harness execution report
    required_fields:
      - status
      - case_id
      - harness
      - exit_code
      - timestamp
      - offline_decode_enabled
      
  - name: decoded_trace.txt
    type: text
    description: Human-readable trace decode from offline processing
    optional: false
    
  - name: decode_metadata.json
    type: json
    description: Metadata from offline decode process
    optional: true

structural_expectations:
  trace_ring:
    - must_exist: true
    - must_be_non_empty: true
    - must_contain_valid_headers: true
    - must_be_decodable_offline: true
    
  decoded_trace:
    - must_exist: true
    - must_be_non_empty: true
    - must_contain_valid_decode: true
    
  report:
    status: "completed"
    exit_code: 0
    case_id: "TRACE-006"
    harness: "runtime_trace"
    offline_decode_completed: true

semantic_expectations:
  - offline_decode_enabled: true
  - decoded_output_valid: true
  - all_events_decoded: true
  - decode_metadata_present: true
  - no_decode_errors: true
  - trace_integrity_valid: true

