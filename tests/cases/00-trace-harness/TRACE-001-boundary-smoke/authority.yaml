version: 1

# Authority chain for TRACE-001-boundary-smoke expectations
# Defines where normative expectations come from

semantic_source: internal-trace-contract

authority_chain:
  tier_0:
    source: "internal-trace-contract"
    description: "Repository-internal trace subsystem contract"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      - "trace/*"
    
  tier_1:
    source: "harness-implementation"
    description: "Runtime trace harness reference implementation"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      
  tier_2:
    source: "case-contract"
    description: "This case's contract definition"
    documents:
      - "tests/cases/00-trace-harness/TRACE-001-boundary-smoke/case.yaml"

expectation_provenance:
  - expectation: "trace.ring exists and non-empty"
    source: "harness-implementation"
    verification: "structural check"
    
  - expectation: "report.json exists and valid"
    source: "harness-implementation"
    verification: "schema validation"
    
  - expectation: "at least one boundary event decoded successfully"
    source: "internal-trace-contract"
    verification: "semantic validation"

generation_method: |
  Expectations derived from harness implementation contract.
  Not from runtime behavior observation.
  
regeneration_steps: |
  1. Review harness implementation in tests/cases/harness/runtime_trace.c
  2. Verify trace ring buffer format and headers
  3. Update expectations to match harness contract

