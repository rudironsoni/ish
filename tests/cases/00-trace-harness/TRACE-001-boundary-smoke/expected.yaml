version: 1

# Expected trace output for TRACE-001-boundary-smoke
# This defines the structural expectations for trace validation

harness_exit_code: 0

required_artifacts:
  - name: trace.ring
    type: binary
    description: Ring buffer trace output
    min_size_bytes: 64
    
  - name: report.json
    type: json
    description: Harness execution report
    required_fields:
      - status
      - case_id
      - harness
      - exit_code
      - timestamp
      
  - name: decoded_trace.txt
    type: text
    description: Human-readable trace decode
    optional: true

structural_expectations:
  trace_ring:
    - must_exist: true
    - must_be_non_empty: true
    - must_contain_valid_headers: true
    
  report:
    status: "completed"
    exit_code: 0
    case_id: "TRACE-001"
    harness: "runtime_trace"

semantic_expectations:
  - at_least_one_boundary_event: true
  - no_decode_errors: true
  - trace_integrity_valid: true

