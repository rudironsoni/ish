version: 1

# Authority chain for TRACE-003-reg-filter expectations
# Defines where normative expectations come from

semantic_source: internal-trace-contract

authority_chain:
  tier_0:
    source: "internal-trace-contract"
    description: "Repository-internal trace subsystem contract"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      - "trace/*"
    
  tier_1:
    source: "harness-implementation"
    description: "Runtime trace harness reference implementation with register filtering"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      
  tier_2:
    source: "case-contract"
    description: "This case's contract definition for register filtering"
    documents:
      - "tests/cases/00-trace-harness/TRACE-003-reg-filter/case.yaml"

expectation_provenance:
  - expectation: "trace.ring exists with register-filtered events"
    source: "harness-implementation"
    verification: "structural check"
    
  - expectation: "report.json includes reg_filter_config field"
    source: "harness-implementation"
    verification: "schema validation"
    
  - expectation: "only selected registers are included in trace"
    source: "internal-trace-contract"
    verification: "semantic validation"
    
  - expectation: "unselected registers are excluded from trace"
    source: "internal-trace-contract"
    verification: "semantic validation"

generation_method: |
  Expectations derived from harness implementation contract.
  Not from runtime behavior observation.
  
regeneration_steps: |
  1. Review harness implementation in tests/cases/harness/runtime_trace.c
  2. Verify register filtering logic and bitmask handling
  3. Update expectations to match harness contract for register filtering

