version: 1

# Authority chain for TRACE-004-dump-on-fault expectations
# Defines where normative expectations come from

semantic_source: internal-trace-contract

authority_chain:
  tier_0:
    source: "internal-trace-contract"
    description: "Repository-internal trace subsystem contract"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      - "trace/*"
    
  tier_1:
    source: "harness-implementation"
    description: "Runtime trace harness reference implementation with fault dumping"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      
  tier_2:
    source: "case-contract"
    description: "This case's contract definition for fault-triggered dumping"
    documents:
      - "tests/cases/00-trace-harness/TRACE-004-dump-on-fault/case.yaml"

expectation_provenance:
  - expectation: "trace.ring captured at fault point"
    source: "harness-implementation"
    verification: "structural check"
    
  - expectation: "report.json includes fault_triggered and dump_location fields"
    source: "harness-implementation"
    verification: "schema validation"
    
  - expectation: "trace is dumped when fault occurs"
    source: "internal-trace-contract"
    verification: "semantic validation"
    
  - expectation: "fault context is preserved in trace"
    source: "internal-trace-contract"
    verification: "semantic validation"

generation_method: |
  Expectations derived from harness implementation contract.
  Not from runtime behavior observation.
  
regeneration_steps: |
  1. Review harness implementation in tests/cases/harness/runtime_trace.c
  2. Verify fault handling and trace dump trigger logic
  3. Update expectations to match harness contract for fault dumping

