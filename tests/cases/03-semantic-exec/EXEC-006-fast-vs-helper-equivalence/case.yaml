id: EXEC-006
phase: 03-semantic-exec
title: Fast path and helper path produce equivalent results
class: semantic
kind: semantic_micro
harness: semantic_micro
meson_test: case:EXEC-006

prerequisites:
  - EXEC-005

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - final_state.json exists
  semantic:
    - fast path and helper path produce identical architectural state
    - register values match between paths
    - flags match between paths
    - memory state matches between paths

allowed_patch_scope:
  - tcti/aarch64/gen.c
  - tcti/aarch64/tcti-gadget-gen.py
  - tcti/aarch64/gadgets_*.c
  - emu/aarch64/cpu.c
  - emu/aarch64/registers.c
  - tests/cases/03-semantic-exec/EXEC-006-fast-vs-helper-equivalence/*

regression_target:
  meson_test: case:EXEC-006

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, x2, x3, x4, x5]
  dump_on: fault

informational_only: false
status: STUB
is_gate_case: true

metadata:
  scaffolded: true
  implementation_ready: false
  notes: |
    Scaffolded case - implementation pending.
    Tests equivalence between fast and helper execution paths.
