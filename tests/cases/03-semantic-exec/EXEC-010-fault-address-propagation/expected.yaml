initial_state:
  registers:
    x0: 0x0000000000002000  # Valid address (TLB mapped)
    x1: 0xDEADBEEFCAFEBABE  # Value to store
  pc: 0x4000
  sp: 0x2000
  nzcv: {n: 0, z: 0, c: 0, v: 0}

code:
  # Test STR with valid address (real TCTI execution)
  # encoding: str x1, [x0] = "01 00 00 f9"
  encoding_hex_le: "010000f9"

execution_sequence:
  final_registers:
    x0: 0x0000000000002000  # Unchanged (no post-index)
    x1: 0xDEADBEEFCAFEBABE  # Unchanged

  final_pc: 0x4004

  expected_tcti_exit_reason: 0  # TCTI_EXIT_NORMAL

success_criteria:
  - name: store_executes
    description: STR instruction stores correctly
  - name: pc_advanced
    description: PC advanced correctly
  - name: tcti_exit_normal
    description: TCTI exit reason is TCTI_EXIT_NORMAL (0)

notes: |
  Tests STR (non post-index) with real TCTI execution.
  Uses tcti_entry_block() for actual gadget execution.
