semantic_authority:
  source: TCTI design specification
  section: Hot Register Mapping and Synchronization
  description: |
    Hot registers are guest registers mapped to host registers for fast access.
    When falling back to C helper, hot registers must be synced to cpu_state.

decode_authority:
  instruction: STR X1, [X0], #8
  encoding: "f8 84 00 01" (LE: 018400f8)
  operation: Mem[X0] = X1, X0 = X0 + 8

semantic_expectation:
  hot_registers:
    description: x0-x15 are hot registers in TCTI
    sync_required: true
    sync_trigger: "TLB miss, unaligned access, or other fallback condition"

  register_preservation:
    x1: "Must be preserved across fast/helper transition"
    x2: "Must be preserved across fast/helper transition"

  test_scenario: |
    1. Initialize x1, x2 with known values
    2. Execute store (simulating fast path)
    3. Verify x1, x2 unchanged
    4. Verify store completed

test_vectors:
  - name: hot_reg_sync
    initial:
      x0: 0x1000
      x1: 0xDEADBEEFCAFEBABE
      x2: 0x123456789ABCDEF0
    expected:
      x0: 0x1008
      x1: 0xDEADBEEFCAFEBABE  # Unchanged
      x2: 0x123456789ABCDEF0  # Unchanged
      memory_at_0x1000: 0xDEADBEEFCAFEBABE

success_criteria:
  - name: preservation
    description: Hot register values unchanged
  - name: store_completes
    description: Store to memory succeeds
  - name: base_updated
    description: Post-index base update correct
