id: EXEC-003
phase: 03-semantic-exec
title: STR with post-index addressing executes correctly
class: semantic
kind: semantic_micro
harness: semantic_micro
meson_test: case:EXEC-003

prerequisites:
  - EXEC-002

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - final_state.json exists
  semantic:
    - architectural state matches expected
    - memory stored correctly
    - base register updated by offset
    - PC advanced correctly

allowed_patch_scope:
  - tcti/aarch64/gen.c
  - tcti/aarch64/tcti-gadget-gen.py
  - tcti/aarch64/gadgets_*.c
  - emu/aarch64/cpu.c
  - tests/cases/03-semantic-exec/EXEC-003-str-postindex/*

regression_target:
  meson_test: case:EXEC-003

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, x2, sp]
  dump_on: fault

informational_only: false
status: REAL_PASS
is_gate_case: true

metadata:
  scaffolded: true
  implementation_ready: true
  notes: |
    STR post-index store with writeback semantics.
    Tests Mem[base] := Rt, then Rn := Rn + imm9.
    Prerequisites: EXEC-002 must be REAL PASS.
