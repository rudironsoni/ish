id: EXEC-012
phase: 03-semantic-exec
title: CMP instruction sets Z=1 when operands are equal
class: semantic
kind: semantic_micro
harness: semantic_micro
meson_test: case:EXEC-012

prerequisites:
  - EXEC-002

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - final_state.json exists
  semantic:
    - TCTI gadgets execute via tcti_entry_block()
    - CMP with equal operands sets Z=1
    - N=0, C=1, V=0 for equal comparison
    - PC advanced correctly
    - Exit reason is TCTI_EXIT_NORMAL

allowed_patch_scope:
  - tcti/aarch64/gen.c
  - tcti/aarch64/tcti-gadget-gen.py
  - tcti/aarch64/gadgets_*.c
  - emu/aarch64/cpu.c
  - tests/cases/03-semantic-exec/EXEC-012-cmp-equality-flags/*

regression_target:
  meson_test: case:EXEC-012

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, nzcv]
  dump_on: fault

informational_only: false
status: pending
is_gate_case: false

metadata:
  scaffolded: true
  implementation_ready: true
  notes: |
    Tests CMP with equal operands (x2, x5) sets Z=1.
    This is the exact failing pattern from the interpreter loop.
    CMP X2, X5 when both contain same value must set Z flag.
