id: EXEC-REAL-001
phase: 03-semantic-exec
title: Real TCTI execution of STR post-index store
class: semantic
kind: semantic_micro
harness: semantic_micro
meson_test: case:EXEC-REAL-001

prerequisites:
  - GEN-003
  - EXEC-003

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc
  secondary_tool: actual execution on host arm64

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - final_state.json exists
  semantic:
    - TCTI gadgets execute via tcti_entry_block()
    - Memory write occurs at correct address
    - Base register updated by offset (post-index)
    - Exit reason is TCTI_EXIT_NORMAL

allowed_patch_scope:
  - tcti/aarch64/gen.c
  - tests/cases/harness/semantic_micro.c
  - tests/cases/03-semantic-exec/EXEC-REAL-001-str-execution/*

regression_target:
  meson_test: case:EXEC-REAL-001

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, x2, sp]
  dump_on: fault

informational_only: false
status: REAL_PASS
is_gate_case: true

metadata:
  scaffolded: true
  implementation_ready: true
  notes: |
    FIRST REAL TCTI EXECUTION TEST.
    Uses actual tcti_entry_block() to execute generated gadgets.
    Tests str xzr, [x2], #8 with proper TLB/MM setup.
    Validates that semantic simulation matches real execution.
