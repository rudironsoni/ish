semantic_authority:
  source: "ARM Architecture Reference Manual for A-profile, DDI0487.J"
  section: "C6.2.279 STR (immediate)"
  url: "https://developer.arm.com/documentation/ddi0487/latest/"

decode_authority:
  source: "A64 instruction encoding tables"
  pattern: "1111100000xxxxxxxxxxxxxx1xxxxx"  # STUR/STR (immediate) post-index
  size: 64  # X register variant

generator_authority:
  gadget_sequence: |
    For str xzr, [x2], #8, generator emits:
    1. tcti_prologue (save host regs, load guest x0-x15)
    2. gadget_str_x Rn=2, Rd=31(zr), imm=8, idx_mode=POST_INDEX
    3. tcti_epilogue (store guest x0-x15, chain or exit)
    4. gadget_exit (if single instruction block)

abi_authority:
  calling_convention: "TCTI x27/x28 chaining"
  reference: "tcti/aarch64/tcti_entry.S and tcti/aarch64/tcti_gadget_gen.py"

stable_fields:
  - instruction_decoding
  - gadget_emission
  - tcti_entry_block_semantics

unstable_fields:
  - internal_gadget_order
  - register_allocation_in_prologue
  - optimization_level

non_authoritative_fields:
  - performance_characteristics
  - cache_behavior
  - timing
