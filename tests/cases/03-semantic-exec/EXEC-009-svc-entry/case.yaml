id: EXEC-009
phase: 03-semantic-exec
title: SVC instruction enters syscall handling correctly
class: semantic
kind: semantic_micro
harness: semantic_micro
meson_test: case:EXEC-009

prerequisites:
  - EXEC-008

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - final_state.json exists
  semantic:
    - TCTI gadgets execute via tcti_entry_block()
    - architectural state matches expected
    - SVC triggers correct exception level transition
    - syscall number extracted correctly
    - return address saved correctly
    - Exit reason is TCTI_EXIT_NORMAL

allowed_patch_scope:
  - tcti/aarch64/gen.c
  - tcti/aarch64/tcti-gadget-gen.py
  - tcti/aarch64/gadgets_*.c
  - emu/aarch64/cpu.c
  - emu/aarch64/syscall.c
  - kernel/syscall.c
  - tests/cases/03-semantic-exec/EXEC-009-svc-entry/*

regression_target:
  meson_test: case:EXEC-009

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault,syscall
  pc_range: null
  regs: [x0, x1, x2, x8, pc, sp]
  dump_on: fault

informational_only: false
status: REAL_PASS
is_gate_case: true

metadata:
  scaffolded: true
  implementation_ready: true
  notes: |
    REAL TCTI EXECUTION - uses actual tcti_entry_block() to execute generated gadgets.
    Tests SVC instruction handling via TCTI gadget chain.
    Exit reason validated as TCTI_EXIT_NORMAL.
