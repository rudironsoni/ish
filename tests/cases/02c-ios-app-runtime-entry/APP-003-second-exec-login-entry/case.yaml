id: APP-003
phase: 02c-ios-app-runtime-entry
title: Second Exec Login Entry
class: app_runtime_entry
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APP-003
prerequisites:
  - APP-002
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: linux-aarch64-abi
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "Second execve (login) is initiated"
    - "Exec entry is captured"
    - "If crash occurs, crash signature is produced"
  semantic:
    - "second_execve_started milestone is reached OR"
    - "Crash occurs at or before this milestone with valid signature"
    - "Highest completed milestone is identified"
    - "First failing milestone is identified"

allowed_patch_scope:
  - "tests/cases/02c-ios-app-runtime-entry/APP-003*/**"
  - "tests/cases/harness/ios_app_harness.c"
  - "tests/cases/harness/boot_milestone_extractor.c"
  - "tests/cases/harness/crash_signature_normalizer.c"

regression_target:
  meson_test: case:APP-003

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 300
  alive_check_interval: 5
  max_alive_wait: 60

milestone_model:
  target_milestone: second_execve_started
  ordered_milestones:
    - app_launched
    - boot_setup_started
    - first_elf_exec_entered
    - first_elf_exec_returned
    - second_execve_started
    - bin_login_elf_header_parsed
    - bin_login_program_headers_read

required_artifacts:
  - name: sim_launch.json
    type: json
  - name: boot_milestones.json
    type: json
  - name: second_exec.json
    type: json
  - name: crash_signature.json
    type: json
  - name: report.json
    type: json

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: |
    SMALLEST LAWFUL APP CASE FOR CURRENT CRASH CLASS.
    The current crash occurs after first elf_exec succeeds and around second exec or guest startup.
    This case is designed to:
    - Execute lawfully through the full pipeline
    - Produce structured artifacts
    - Identify highest completed milestone
    - Identify first failing milestone
    - MAY initially classify as REAL FAIL (this is expected)
    - MUST NOT be forced to REAL PASS artificially
    
    This case reduces the crash class to the earliest failing milestone,
    enabling focused debugging without broad subsystem speculation.
