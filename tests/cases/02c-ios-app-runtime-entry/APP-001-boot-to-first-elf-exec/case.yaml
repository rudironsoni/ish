id: APP-001
phase: 02c-ios-app-runtime-entry
title: Boot to First ELF Exec
class: app_runtime_entry
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APP-001
prerequisites:
  - APPSIM-003
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: linux-aarch64-abi
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "App launches successfully"
    - "First ELF exec entry is reached"
    - "Boot milestone captured"
  semantic:
    - "first_elf_exec_entered milestone is reached"
    - "Exec context is valid"

allowed_patch_scope:
  - "tests/cases/02c-ios-app-runtime-entry/APP-001*/**"
  - "tests/cases/harness/ios_app_harness.c"

regression_target:
  meson_test: case:APP-001

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 300
  alive_check_interval: 5
  max_alive_wait: 60

milestone_model:
  target_milestone: first_elf_exec_entered
  ordered_milestones:
    - app_launched
    - boot_setup_started
    - first_elf_exec_entered

required_artifacts:
  - name: sim_launch.json
    type: json
    description: Launch metadata
  - name: boot_milestones.json
    type: json
    description: Boot progression milestones
  - name: first_elf_exec.json
    type: json
    description: First ELF exec entry data
  - name: report.json
    type: json
    description: Case execution report

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Early app runtime case - proves boot reaches first ELF exec"
