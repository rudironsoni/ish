name: IXLand
options:
  bundleIdPrefix: app.ixland
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift
    from: 1.0.0
  IXLandInstrumentation:
    path: Packages/IXLandInstrumentation

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: false
    CLANG_ENABLE_OBJC_ARC: true
    LINUX_UAPI_VERSION: '6.12'
    LINUX_UAPI_ARCH: arm64
    LINUX_UAPI_VENDOR_ROOT: $(SRCROOT)/third_party/linux-uapi
    LINUX_UAPI_ROOT: $(LINUX_UAPI_VENDOR_ROOT)/$(LINUX_UAPI_VERSION)/$(LINUX_UAPI_ARCH)
    LINUX_UAPI_INCLUDE_ROOT: $(LINUX_UAPI_ROOT)/include
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true

targetTemplates:
  LinuxRuntimeBase:
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.linuxruntime
      PRODUCT_NAME: IXLandLinuxRuntime
      HEADER_SEARCH_PATHS:
      - "$(LINUX_UAPI_INCLUDE_ROOT)"
      - "$(SRCROOT)/include"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentation/include"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"
      GCC_PREPROCESSOR_DEFINITIONS:
      - "IXLAND_LINUX_RUNTIME=1"
      - "ISH_PLATFORM_IOS=1"

targets:
  # MARK: - Product Target
  IXLandLinuxRuntime:
    templates:
    - LinuxRuntimeBase
    type: library.static
    platform: iOS
    sources:
    - path: Sources/IXLandLinuxRuntime
      headerVisibility: project
      excludes:
      - "trace/**"
      - "platform/**"
    - path: internal/ios
      headerVisibility: project
    - path: include/ixland
      headerVisibility: project
    dependencies:
    - package: IXLandInstrumentation
      product: IXLandInstrumentation
    - package: IXLandInstrumentation
      product: IXLandInstrumentationTracing
    - package: libarchive-for-swift
      product: libarchive
    settings:
      ENABLE_CODE_COVERAGE: false
    scheme:
      testTargets:
      - IXLandLinuxRuntimeContractTests
      - IXLandLinuxRuntimeSystemTests
      - IXLandLinuxRuntimePerfTests

  # MARK: - Contract Test Target
  IXLandLinuxRuntimeContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: Tests/IXLandLinuxRuntimeContractTests
      excludes:
      - "**/DISABLED/**"
      - "*.md"
    - path: Tests/Support/TCTITestHarness
      excludes:
      - "tcti_four_boundary.c"
      - "tcti_harness_truth.c"
    dependencies:
    - target: IXLandTerminal
    - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
      - "$(LINUX_UAPI_INCLUDE_ROOT)"
      - "$(SRCROOT)/include"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - System Test Target
  IXLandLinuxRuntimeSystemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: Tests/IXLandLinuxRuntimeSystemTests
      excludes:
      - "**/DISABLED/**"
      - "*.md"
    - path: Tests/Support/GuestExecutionHarness
    dependencies:
    - target: IXLandTerminal
    - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
      - "$(LINUX_UAPI_INCLUDE_ROOT)"
      - "$(SRCROOT)/include"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)"
      - "$(SRCROOT)/Tests/Support"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - Performance Test Target
  IXLandLinuxRuntimePerfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: Tests/IXLandLinuxRuntimePerfTests
      excludes:
      - "**/DISABLED/**"
      - "*.md"
    - path: Tests/Fixtures/ELF
      includes:
      - "*.elf"
      - "*.bin"
      buildPhase: resources
    dependencies:
    - target: IXLandTerminal
    - target: IXLandLinuxRuntime
    - package: IXLandInstrumentation
      product: IXLandInstrumentationTracing
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
      - "$(LINUX_UAPI_INCLUDE_ROOT)"
      - "$(SRCROOT)/include"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - Terminal App
  IXLandTerminal:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
    - path: Sources/IXLandTerminal
      excludes:
      - "Tests/**"
      - "UITests/**"
      - "targets/**"
      - "xcode-ninja.sh"
      - "PasteboardDeviceLinux.c"
      - "LinuxTTY.c"
      - "LinuxPTY.c"
      - "LinuxInterop.c"
      - "LinuxInterop.h"
      - "LinuxRoot.c"
    - path: tools
      headerVisibility: project
      includes:
      - "fakefs.h"
      - "fakefs.c"
    - path: $(DERIVED_FILE_DIR)/mach_excServer.c
      optional: true
    preBuildScripts:
    - name: Generate mach_excServer
      script: |
        set -x
        cd "$DERIVED_FILE_DIR"
        mig -sheader "$DERIVED_FILE_DIR/mach_excServer.h" -server "$DERIVED_FILE_DIR/mach_excServer.c" -Wno-incompatible-sysroot -isysroot "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include/mach/mach_exc.defs"
      basedOnDependencyAnalysis: false
      outputFiles:
      - "$(DERIVED_FILE_DIR)/mach_excServer.h"
      - "$(DERIVED_FILE_DIR)/mach_excServer.c"
    - name: Provision bundled rootfs
      script: |
        set -eu
        ROOTFS_OUT="${DERIVED_FILE_DIR}/root.tar.gz"
        TMP_OUT="${ROOTFS_OUT}.tmp"
        ROOTFS_SOURCE_URL="${ROOTFS_URL:-https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64/alpine-minirootfs-3.23.3-aarch64.tar.gz}"
        if [ -s "$ROOTFS_OUT" ]; then
            gzip -t "$ROOTFS_OUT"
        else
            rm -f "$TMP_OUT"
            curl --fail --location --silent --show-error "$ROOTFS_SOURCE_URL" --output "$TMP_OUT"
            gzip -t "$TMP_OUT"
            mv "$TMP_OUT" "$ROOTFS_OUT"
        fi
        cp -f "$ROOTFS_OUT" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/root.tar.gz"
      basedOnDependencyAnalysis: false
      outputFiles:
      - "$(DERIVED_FILE_DIR)/root.tar.gz"
      - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/root.tar.gz"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.terminal
      PRODUCT_NAME: IXLandTerminal
      INFOPLIST_FILE: Sources/IXLandTerminal/Info.plist
      CODE_SIGN_ENTITLEMENTS: Sources/IXLandTerminal/iSH.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      HEADER_SEARCH_PATHS:
      - "$(LINUX_UAPI_INCLUDE_ROOT)"
      - "$(SRCROOT)/Sources/IXLandTerminal"
      - "$(DERIVED_FILE_DIR)"
      - "$(SRCROOT)/include"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)/tools"
      - "$(SDKROOT)/usr/include/libxml2"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentation/include"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationBridge"
      - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"
    dependencies:
    - target: IXLandLinuxRuntime
    - package: IXLandInstrumentation
      product: IXLandInstrumentation
    - package: IXLandInstrumentation
      product: IXLandInstrumentationTracing
    - package: IXLandInstrumentation
      product: IXLandInstrumentationBridge
    - package: libarchive-for-swift
      product: libarchive
    - sdk: CoreLocation.framework
    - sdk: UIKit.framework
    - sdk: WebKit.framework
    - sdk: SystemConfiguration.framework
    - sdk: CoreGraphics.framework
    - sdk: QuartzCore.framework
    - sdk: AudioToolbox.framework
    - sdk: libsqlite3.tbd
    - sdk: libxml2.tbd
    - sdk: libresolv.tbd
    - sdk: libiconv.tbd
    - sdk: UniformTypeIdentifiers.framework

  # MARK: - Terminal Unit Tests
  IXLandTerminalUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests/IXLandTerminalUnitTests
    dependencies:
    - target: IXLandTerminal
    - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
      - "$(LINUX_UAPI_INCLUDE_ROOT)"
      - "$(SRCROOT)/include"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)"

  # MARK: - Terminal End-to-End Tests
  IXLandTerminalEnd2EndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: Tests/IXLandTerminalEnd2EndTests
      excludes:
      - "cases/**"
      - "Info.plist"
      - "Screenshots.m"
    resources:
    - Tests/IXLandTerminalEnd2EndTests/cases
    dependencies:
    - target: IXLandTerminal
    settings:
      GENERATE_INFOPLIST_FILE: true

# MARK: - Test Plans and Schemes
# Canonical schemes only: IXLand-6.12-arm64 (app) and IXLandRuntime-6.12-arm64 (runtime)
schemes:
  IXLand-6.12-arm64:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
        IXLandTerminalUnitTests: all
        IXLandTerminalEnd2EndTests: [build-for-testing]
    run:
      config: Debug
      executable: IXLandTerminal
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: IXLandTerminalUnitTests
          parallelizable: false
        - name: IXLandTerminalEnd2EndTests
          parallelizable: false

  IXLandRuntime-6.12-arm64:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
        IXLandLinuxRuntimeContractTests: [build-for-testing]
        IXLandLinuxRuntimeSystemTests: [build-for-testing]
        IXLandLinuxRuntimePerfTests: [build-for-testing]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: IXLandLinuxRuntimeContractTests
          parallelizable: false
        - name: IXLandLinuxRuntimeSystemTests
          parallelizable: false
        - name: IXLandLinuxRuntimePerfTests
          parallelizable: false
