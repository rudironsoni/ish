name: IXLand
options:
  bundleIdPrefix: app.ixland
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift
    from: 1.0.0
  IXLandInstrumentation:
    path: Packages/IXLandInstrumentation

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: false
    CLANG_ENABLE_OBJC_ARC: true

targetTemplates:
  LinuxRuntimeBase:
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.linuxruntime
      PRODUCT_NAME: IXLandLinuxRuntime
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentation/include"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "IXLAND_LINUX_RUNTIME=1"
        - "ISH_PLATFORM_IOS=1"

targets:
  # MARK: - IXLandLinuxRuntime Framework
  IXLandLinuxRuntime:
    templates:
      - LinuxRuntimeBase
    type: library.static
    platform: iOS
    sources:
      - path: Sources/IXLandLinuxRuntime
        headerVisibility: project
        excludes:
          - "platform/linux.c"
          - "kernel/calls.c"
          - "trace/**"
    dependencies:
      - package: IXLandInstrumentation
        product: IXLandInstrumentation
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
      - package: libarchive-for-swift
        product: libarchive
    scheme:
      testTargets:
        - IXLandLinuxRuntimeUnitTests
        - IXLandLinuxRuntimeFunctionalTests

  # MARK: - IXLandLinuxRuntime Unit Tests
  IXLandLinuxRuntimeUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IXLandLinuxRuntimeUnitTests
        excludes:
          - "decoder_test.c"
          - "e2e/**"
          - "gen_test_simple.c"
          - "gen_test_minimal.c"
          - "gadget_test.c"
          - "sysreg_test.c"
          - "test_*.c"
          - "test-dp-reg.c"
          - "arm-reference.txt"
          - "*.md"
      - path: Tests/Support/TCTITestHarness
    dependencies:
      - target: IXLandTerminal
      - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"

  # MARK: - IXLandLinuxRuntime Functional Tests
  IXLandLinuxRuntimeFunctionalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IXLandLinuxRuntimeFunctionalTests
        excludes:
          - "decoder_functional_test.c"
          - "functional_test.c"
          - "integration_test_simple.c"
          - "integration_test.c"
          - "IXLandLinuxRuntimeFunctionalTests.swift"
      - path: Tests/Support/TCTITestHarness
    dependencies:
      - target: IXLandTerminal
      - target: IXLandLinuxRuntime
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - IXLandLinuxRuntime End-to-End Tests
  IXLandLinuxRuntimeEnd2EndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/IXLandLinuxRuntimeEnd2EndTests
        excludes:
          - "cases/**"
          - "manual/**"
          - "benchmark/**"
          - "workloads/**"
          - "harness/**"
          - "run_cases.py"
          - "RuntimeCaseCorpusTests.swift"
          - "DEPRECATED_TESTS.md"
    dependencies:
      - target: IXLandTerminal
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
    settings:
      GENERATE_INFOPLIST_FILE: true
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.linuxruntime.e2e
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - IXLandTerminal App
  IXLandTerminal:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/IXLandTerminal
        excludes:
          - "Tests/**"
          - "UITests/**"
          - "targets/**"
          - "xcode-ninja.sh"
          - "PasteboardDeviceLinux.c"
          - "LinuxTTY.c"
          - "LinuxPTY.c"
          - "LinuxInterop.c"
          - "LinuxInterop.h"
          - "LinuxRoot.c"
      - path: tools
        headerVisibility: project
        includes:
          - "fakefs.h"
          - "fakefs.c"
      - path: $(DERIVED_FILE_DIR)/mach_excServer.c
        optional: true
    preBuildScripts:
      - name: Generate mach_excServer
        script: |
          set -x
          cd "$DERIVED_FILE_DIR"
          mig -sheader "$DERIVED_FILE_DIR/mach_excServer.h" -server "$DERIVED_FILE_DIR/mach_excServer.c" -Wno-incompatible-sysroot -isysroot "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include/mach/mach_exc.defs"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/mach_excServer.h"
          - "$(DERIVED_FILE_DIR)/mach_excServer.c"
      - name: Provision bundled rootfs
        script: |
          set -eu
          ROOTFS_OUT="${DERIVED_FILE_DIR}/root.tar.gz"
          TMP_OUT="${ROOTFS_OUT}.tmp"
          ROOTFS_SOURCE_URL="${ROOTFS_URL:-https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64/alpine-minirootfs-3.23.3-aarch64.tar.gz}"
          if [ -s "$ROOTFS_OUT" ]; then
            gzip -t "$ROOTFS_OUT"
          else
            rm -f "$TMP_OUT"
            curl --fail --location --silent --show-error "$ROOTFS_SOURCE_URL" --output "$TMP_OUT"
            gzip -t "$TMP_OUT"
            mv "$TMP_OUT" "$ROOTFS_OUT"
          fi
          cp -f "$ROOTFS_OUT" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/root.tar.gz"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/root.tar.gz"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/root.tar.gz"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.terminal
      PRODUCT_NAME: IXLandTerminal
      INFOPLIST_FILE: Sources/IXLandTerminal/Info.plist
      CODE_SIGN_ENTITLEMENTS: Sources/IXLandTerminal/iSH.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources/IXLandTerminal"
        - "$(DERIVED_FILE_DIR)"
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)/tools"
        - "$(SDKROOT)/usr/include/libxml2"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentation/include"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationBridge"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"
    dependencies:
      - target: IXLandLinuxRuntime
      - package: IXLandInstrumentation
        product: IXLandInstrumentation
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
      - package: IXLandInstrumentation
        product: IXLandInstrumentationBridge
      - package: libarchive-for-swift
        product: libarchive
      - sdk: CoreLocation.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: libsqlite3.tbd
      - sdk: libxml2.tbd
      - sdk: libresolv.tbd
      - sdk: libiconv.tbd
      - sdk: UniformTypeIdentifiers.framework

  # MARK: - IXLandTerminal Unit Tests
  IXLandTerminalUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/IXLandTerminalUnitTests
    dependencies:
      - target: IXLandTerminal
      - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"

  # MARK: - IXLandTerminal End-to-End Tests
  IXLandTerminalEnd2EndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/IXLandTerminalEnd2EndTests
        excludes:
          - "cases/**"
          - "Info.plist"
          - "Screenshots.m"
    resources:
      - Tests/IXLandTerminalEnd2EndTests/cases
    dependencies:
      - target: IXLandTerminal
    settings:
      GENERATE_INFOPLIST_FILE: true

schemes:
  IXLand:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
    run:
      config: Debug
      executable: IXLandTerminal
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: IXLandLinuxRuntimeUnitTests
          parallelizable: false
        - name: IXLandLinuxRuntimeFunctionalTests
          parallelizable: false
        - name: IXLandTerminalUnitTests
          parallelizable: false
        - IXLandTerminalEnd2EndTests
        - IXLandLinuxRuntimeEnd2EndTests

  IXLandLinuxRuntimeFunctionalTests:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
        IXLandLinuxRuntimeFunctionalTests: [build-for-testing]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: IXLandLinuxRuntimeFunctionalTests
          parallelizable: false
