name: IXLand
options:
  bundleIdPrefix: app.ixland
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  libarchive-for-swift:
    url: https://github.com/matteo-pacini/libarchive-for-swift
    from: 1.0.0
  IXLandInstrumentation:
    path: Packages/IXLandInstrumentation

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: false
    CLANG_ENABLE_OBJC_ARC: true

targetTemplates:
  LinuxRuntimeBase:
    platform: iOS
    deploymentTarget: "14.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.linuxruntime
      PRODUCT_NAME: IXLandLinuxRuntime
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentation/include"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "IXLAND_LINUX_RUNTIME=1"
        - "ISH_PLATFORM_IOS=1"

targets:
  # MARK: - IXLandLinuxRuntime Framework
  IXLandLinuxRuntime:
    templates:
      - LinuxRuntimeBase
    type: library.static
    platform: iOS
    sources:
      - path: Sources/IXLandLinuxRuntime
        headerVisibility: project
        excludes:
          - "platform/linux.c"
          - "kernel/calls.c"
          - "trace/**"
    dependencies:
      - package: IXLandInstrumentation
        product: IXLandInstrumentation
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
      - package: libarchive-for-swift
        product: libarchive
    scheme:
      testTargets:
        - IXLandLinuxRuntimeUnitTests
        - IXLandLinuxRuntimeFunctionalTests

  # MARK: - IXLandLinuxRuntime Unit Tests
  IXLandLinuxRuntimeUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IXLandLinuxRuntimeUnitTests
        excludes:
          - "e2e/**"
          - "gen_test_simple.c"
          - "gen_test_minimal.c"
          - "gadget_test.c"
          - "gen_test.c"
          - "test_*.c"
          - "test-dp-reg.c"
          - "arm-reference.txt"
          - "*.md"
    dependencies:
      - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"

  # MARK: - IXLandLinuxRuntime Functional Tests
  IXLandLinuxRuntimeFunctionalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IXLandLinuxRuntimeFunctionalTests
        excludes:
          - "decoder_functional_test.c"
          - "functional_test.c"
          - "integration_test_simple.c"
          - "integration_test.c"
      - path: Tests/IXLandLinuxRuntimeEnd2EndTests/cases/harness
        excludes:
          - "ios_app_harness.c"
          - "case_schema.py"
          - "harness_runner.h"
    preBuildScripts:
      - name: Copy Case Corpus
        script: |
          # Only copy if source cases are newer than destination
          CASES_DIR="${SRCROOT}/Tests/IXLandLinuxRuntimeEnd2EndTests/cases"
          DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/cases"
          
          # Check if any case file is newer than the destination marker
          NEEDS_COPY=0
          if [ ! -f "$DEST/.copied" ]; then
            NEEDS_COPY=1
          else
            # Find any file in cases newer than our marker
            if find "$CASES_DIR" -type f -newer "$DEST/.copied" | grep -q .; then
              NEEDS_COPY=1
            fi
          fi
          
          if [ "$NEEDS_COPY" -eq 1 ]; then
            echo "Copying case corpus to test bundle..."
            rm -rf "$DEST"
            mkdir -p "$DEST"
            for phase in 01-decode 02-generator 03-semantic-exec 04-mmu-abi 05-elf-loader 06-syscalls-core-fs-net 07-threads-signals-tls 08-musl 09-glibc 10-tooling-stability-ios 11-distro-matrix; do
              if [ -d "$CASES_DIR/$phase" ]; then
                cp -R "$CASES_DIR/$phase" "$DEST/"
              fi
            done
            touch "$DEST/.copied"
            echo "Case corpus copied successfully"
          else
            echo "Case corpus up to date, skipping copy"
          fi
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/cases/.copied"
    dependencies:
      - target: IXLandLinuxRuntime
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"
        - "$(SRCROOT)/Tests/IXLandLinuxRuntimeEnd2EndTests/cases/harness"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - IXLandLinuxRuntime End-to-End Tests
  IXLandLinuxRuntimeEnd2EndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/IXLandLinuxRuntimeEnd2EndTests
        excludes:
          - "cases/**"
          - "manual/**"
          - "benchmark/**"
          - "workloads/**"
          - "harness/**"
          - "run_cases.py"
          - "RuntimeCaseCorpusTests.swift"
          - "DEPRECATED_TESTS.md"
      - path: Tests/IXLandLinuxRuntimeEnd2EndTests/cases/harness
        includes:
          - "ios_app_harness.c"
    preBuildScripts:
      - name: Copy E2E Cases
        script: |
          # Only copy if source cases are newer than destination
          CASES_DIR="${SRCROOT}/Tests/IXLandLinuxRuntimeEnd2EndTests/cases"
          DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/cases"
          
          NEEDS_COPY=0
          if [ ! -f "$DEST/.copied" ]; then
            NEEDS_COPY=1
          else
            if find "$CASES_DIR/00-trace-harness" "$CASES_DIR/02c-ios-app-runtime-entry" -type f -newer "$DEST/.copied" 2>/dev/null | grep -q .; then
              NEEDS_COPY=1
            fi
          fi
          
          if [ "$NEEDS_COPY" -eq 1 ]; then
            echo "Copying E2E cases to test bundle..."
            rm -rf "$DEST"
            mkdir -p "$DEST"
            for phase in 00-trace-harness 02c-ios-app-runtime-entry; do
              if [ -d "$CASES_DIR/$phase" ]; then
                cp -R "$CASES_DIR/$phase" "$DEST/"
              fi
            done
            touch "$DEST/.copied"
            echo "E2E cases copied successfully"
          else
            echo "E2E cases up to date, skipping copy"
          fi
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/cases/.copied"
    dependencies:
      - target: IXLandTerminal
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
    settings:
      GENERATE_INFOPLIST_FILE: true
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.linuxruntime.e2e
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"
        - "$(SRCROOT)/Tests/IXLandLinuxRuntimeEnd2EndTests/cases/harness"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"

  # MARK: - IXLandTerminal App
  IXLandTerminal:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/IXLandTerminal
        excludes:
          - "Tests/**"
          - "UITests/**"
          - "targets/**"
          - "xcode-ninja.sh"
          - "PasteboardDeviceLinux.c"
          - "LinuxTTY.c"
          - "LinuxPTY.c"
          - "LinuxInterop.c"
          - "LinuxInterop.h"
          - "LinuxRoot.c"
      - path: tools
        headerVisibility: project
        includes:
          - "fakefs.h"
          - "fakefs.c"
      - path: $(DERIVED_FILE_DIR)/mach_excServer.c
        optional: true
    preBuildScripts:
      - name: Generate mach_excServer
        script: |
          set -x
          cd "$DERIVED_FILE_DIR"
          mig -sheader "$DERIVED_FILE_DIR/mach_excServer.h" -server "$DERIVED_FILE_DIR/mach_excServer.c" -Wno-incompatible-sysroot -isysroot "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include/mach/mach_exc.defs"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/mach_excServer.h"
          - "$(DERIVED_FILE_DIR)/mach_excServer.c"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.ixland.terminal
      PRODUCT_NAME: IXLandTerminal
      INFOPLIST_FILE: Sources/IXLandTerminal/Info.plist
      CODE_SIGN_ENTITLEMENTS: Sources/IXLandTerminal/iSH.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources/IXLandTerminal"
        - "$(DERIVED_FILE_DIR)"
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)/tools"
        - "$(SDKROOT)/usr/include/libxml2"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentation/include"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationBridge"
        - "$(SRCROOT)/Packages/IXLandInstrumentation/Sources/IXLandInstrumentationTracing/include"
    dependencies:
      - target: IXLandLinuxRuntime
      - package: IXLandInstrumentation
        product: IXLandInstrumentation
      - package: IXLandInstrumentation
        product: IXLandInstrumentationTracing
      - package: IXLandInstrumentation
        product: IXLandInstrumentationBridge
      - package: libarchive-for-swift
        product: libarchive
      - sdk: CoreLocation.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: libsqlite3.tbd
      - sdk: libxml2.tbd
      - sdk: libresolv.tbd
      - sdk: libiconv.tbd
      - sdk: UniformTypeIdentifiers.framework

  # MARK: - IXLandTerminal Unit Tests
  IXLandTerminalUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/IXLandTerminalUnitTests
    dependencies:
      - target: IXLandTerminal
      - target: IXLandLinuxRuntime
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IXLandTerminal.app/IXLandTerminal"
      BUNDLE_LOADER: "$(TEST_HOST)"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Sources"
        - "$(SRCROOT)"

  # MARK: - IXLandTerminal End-to-End Tests
  IXLandTerminalEnd2EndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/IXLandTerminalEnd2EndTests
        excludes:
          - "Info.plist"
          - "Screenshots.m"
    dependencies:
      - target: IXLandTerminal
    settings:
      GENERATE_INFOPLIST_FILE: true

schemes:
  IXLand:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
    run:
      config: Debug
      executable: IXLandTerminal
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: IXLandLinuxRuntimeUnitTests
          parallelizable: true
        - name: IXLandLinuxRuntimeFunctionalTests
          parallelizable: false
        - IXLandTerminalEnd2EndTests
        - IXLandLinuxRuntimeEnd2EndTests

  IXLandFunctionalTests:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
        IXLandLinuxRuntimeFunctionalTests: [build-for-testing]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: IXLandLinuxRuntimeFunctionalTests
          parallelizable: false

  # MARK: - Runtime Case Verification Scheme
  # Minimal scheme for fast runtime case testing
  # Usage:
  #   xcodebuild build-for-testing -scheme IXLandRuntimeCases -destination 'platform=iOS Simulator,name=iPhone 17' ...
  #   xcodebuild test-without-building -scheme IXLandRuntimeCases -destination 'platform=iOS Simulator,name=iPhone 17' ...
  IXLandRuntimeCases:
    build:
      targets:
        IXLandLinuxRuntime: all
        IXLandTerminal: all
        IXLandLinuxRuntimeFunctionalTests: [build-for-testing]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: IXLandLinuxRuntimeFunctionalTests
          parallelizable: false


