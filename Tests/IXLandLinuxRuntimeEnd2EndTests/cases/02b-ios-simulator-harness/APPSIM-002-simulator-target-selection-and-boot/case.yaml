id: APPSIM-002
phase: 02b-ios-simulator-harness
title: Simulator Target Selection and Boot
class: app_harness_capability
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APPSIM-002
prerequisites:
  - APPSIM-001
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: ios-sandbox-contract
  primary_tool: XcodeBuildMCP
  secondary_tool: simctl

success_criteria:
  structural:
    - "Simulator target is selected from available targets"
    - "Simulator boots successfully"
    - "Boot status is observable"
  semantic:
    - "Selected simulator is targetable and responsive"
    - "Boot completes within timeout"
    - "Simulator state is ready for app installation"

allowed_patch_scope:
  - "tests/cases/02b-ios-simulator-harness/APPSIM-002*/**"
  - "tests/cases/harness/ios_app_harness.c"

regression_target:
  meson_test: case:APPSIM-002

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 120
  alive_check_interval: 5
  max_alive_wait: 60

required_artifacts:
  - name: simulator_target.json
    type: json
    description: Selected simulator device and runtime
  - name: device_runtime.json
    type: json
    description: Device type and iOS runtime version
  - name: boot_status.json
    type: json
    description: Simulator boot result and state
  - name: report.json
    type: json
    description: Case execution report

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Proves simulator can be selected and booted"
