case_id: SIG-003
authority_type: runtime_fixture

semantic_authority:
  source: IEEE Std 1003.1-2017 (POSIX.1-2017)
  document: sigaction, signal handling flags
  reference: SA_RESTART, SA_RESETHAND, SA_NODEFER

abi_authority:
  source: Linux Signal ABI
  sa_flags: Bitmap of signal handling options
  SA_RESTART: Automatically restart interrupted syscalls
  SA_RESETHAND: Restore SIG_DFL after handler
  SA_NODEFER: Do not block signal during handler

expectation_source:
  - SA_RESTART prevents EINTR for certain syscalls
  - SIG_DFL terminates process for most signals
  - SIG_IGN discards signal without action
  - Ignored signals do not wake sleeping processes
  - Alarm can interrupt blocking operations

known_gaps:
  - Does not verify syscall restart for all syscalls
  - Does not test SA_RESETHAND behavior
  - Does not verify fatal signal termination
  - Does not test core dump generation

non_authoritative_fields:
  - Exact list of restartable syscalls
  - Signal delivery timing relative to syscalls
  - Behavior with SA_RESTART on non-restartable syscalls
