case_id: SIG-002
phase: 07-threads-signals-tls
description: Signal delivery to threads works correctly

expected_behavior:
  - Signals sent to process are delivered to threads
  - Thread creation does not break signal handling
  - Signal handler executes in context of receiving thread
  - Multiple threads can coexist with signal handlers

expected_artifacts:
  report.json:
    schema: case_report_v1
    required_fields:
      - case_id: "SIG-002"
      - phase: "07-threads-signals-tls"
      - harness: "thread_signal_fixture"
      - passed: true

  thread_log.json:
    schema: thread_log_v1
    required_events:
      - event: "signal_thread_delivery"

success_criteria:
  - Harness exits with code 0
  - Signal handler is installed successfully
  - Thread is created and runs
  - Signal is delivered to the process
  - Signal handler executes without crash
  - Thread can exit cleanly after signal
