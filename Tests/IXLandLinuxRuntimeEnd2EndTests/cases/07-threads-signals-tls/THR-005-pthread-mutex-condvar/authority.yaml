case_id: THR-005
authority_type: runtime_fixture

semantic_authority:
  source: IEEE Std 1003.1-2017 (POSIX.1-2017)
  document: pthread_mutex_* and pthread_cond_* specification
  url: https://pubs.opengroup.org/onlinepubs/9699919799/

abi_authority:
  source: POSIX Threads API
  mutex_operations:
    - pthread_mutex_init
    - pthread_mutex_lock
    - pthread_mutex_unlock
    - pthread_mutex_trylock
    - pthread_mutex_destroy
  cond_operations:
    - pthread_cond_init
    - pthread_cond_signal
    - pthread_cond_broadcast
    - pthread_cond_wait
    - pthread_cond_destroy

expectation_source:
  - Mutex provides mutual exclusion between threads
  - Lock/unlock operations are atomic
  - Trylock returns EBUSY if mutex already locked
  - Signal wakes at least one waiting thread

known_gaps:
  - Does not test pthread_cond_wait (requires real waiting)
  - Does not test error checking mutex types
  - Does not verify priority inheritance
  - Does not test timed operations
