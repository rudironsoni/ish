case_id: THR-004
authority_type: runtime_fixture

semantic_authority:
  source: Linux Kernel Documentation
  document: futex(2) man page, Futexes Are Tricky paper
  reference: https://man7.org/linux/man-pages/man2/futex.2.html

abi_authority:
  source: Linux AArch64 System Call ABI
  syscall_number: SYS_futex
  operations:
    - FUTEX_WAIT: Wait on uaddr if value matches
    - FUTEX_WAKE: Wake up to val waiters
    - FUTEX_WAIT_BITSET: Wait with bitset
    - FUTEX_WAKE_BITSET: Wake with bitset

platform_notes:
  - Linux-specific mechanism (not available on macOS)
  - Foundation for higher-level synchronization primitives
  - Used by pthread mutexes and condition variables

known_gaps:
  - Does not test FUTEX_CMP_REQUEUE
  - Does not test PI (priority inheritance) futexes
  - Does not verify wake-up ordering guarantees
