semantic_authority:
  source: Linux Programmer's Manual - mprotect(2)
  url: https://man7.org/linux/man-pages/man2/mprotect.2.html
  stable_since: POSIX.1-2001

abi_authority:
  source: Linux AArch64 ABI
  mprotect_syscall_number: 226
  notes: |
    mprotect changes the access protections for the calling process's
    memory pages containing any part of the address range in the
    interval [addr, addr+len-1].

toolchain_notes:
  runtime_verification: |
    This case uses runtime fixture testing on the host system.
    The harness validates actual mprotect behavior against
    documented semantics.

known_gaps:
  - PROT_EXEC testing not performed (security constraints on macOS)
  - Signal handler verification for SIGSEGV on PROT_NONE access not tested

non_authoritative_fields:
  - Specific page table implementation details
  - TLB invalidation timing (see MMU-006 for TLB-specific tests)
