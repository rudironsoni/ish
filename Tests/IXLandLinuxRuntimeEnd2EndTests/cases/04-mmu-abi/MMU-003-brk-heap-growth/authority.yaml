semantic_authority:
  source: Linux Programmer's Manual - brk/sbrk(2)
  url: https://man7.org/linux/man-pages/man2/brk.2.html
  stable_since: POSIX.1-2001
  note: deprecated in POSIX.1-2001, replaced by malloc/free

abi_authority:
  source: Linux AArch64 ABI
  brk_syscall_number: 214
  notes: |
    brk() and sbrk() change the location of the program break,
    which defines the end of the process's data segment.
    Increasing the program break allocates memory to the process.

toolchain_notes:
  runtime_verification: |
    This case uses runtime fixture testing on the host system.
    The harness validates actual sbrk behavior against
    documented semantics.

platform_notes:
  macos_limitations: |
    sbrk is deprecated on macOS and may not support shrinking
    the heap. The test accounts for this by skipping the shrink
    test on Darwin/macOS platforms.

known_gaps:
  - brk() vs sbrk() distinction not explicitly tested
  - Heap shrinking not tested on macOS
  - Interaction with malloc/free not validated

non_authoritative_fields:
  - Internal kernel heap management details
  - Exact memory layout between data segment and heap
