semantic_authority:
  source: Linux Programmer's Manual - mmap(2), mprotect(2)
  url: https://man7.org/linux/man-pages/man2/mmap.2.html
  stable_since: POSIX.1-2001

abi_authority:
  source: Linux AArch64 ABI
  notes: |
    mmap creates a mapping in the virtual address space.
    Multiple pages can be mapped contiguously and each
    page can have independent permissions.

toolchain_notes:
  runtime_verification: |
    This case uses runtime fixture testing on the host system.
    Tests verify multi-page allocation and permission isolation.

platform_notes:
  page_size_variation: |
    System page size varies by platform (4KB, 16KB, 64KB).
    Test uses sysconf(_SC_PAGESIZE) to determine actual size.

known_gaps:
  - Cross-page unaligned multi-byte access not tested
  - Actual SIGSEGV on permission violation not verified
  - TLB behavior during permission change not tested (see MMU-006)

non_authoritative_fields:
  - Exact physical memory layout
  - Kernel page table implementation
