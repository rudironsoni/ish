tpidr_el0_requirements:
  initialization:
    - TPIDR_EL0 register initialized at process startup
    - value is non-zero (points to TLS block)
    - TLS memory is accessible (platform-dependent)

  access_method:
    - instruction: MRS TPIDR_EL0
    - returns: pointer to TLS block

  validation:
    - check: register is non-zero
    - check: points to valid memory (Linux)
    - check: platform-specific layout (macOS)

invariants:
  - "TPIDR_EL0 != 0 after initialization"
  - "TLS accessible via TPIDR_EL0 pointer"

validation_checks:
  - name: tpidr_initialized
    assertion: "TPIDR_EL0 is non-zero"
    critical: true

  - name: tls_accessible
    assertion: "TLS memory readable/writable"
    critical: true
    note: "Platform-specific on macOS"

success_criteria:
  - TPIDR_EL0 initialized
  - TLS accessible (platform-permitting)
