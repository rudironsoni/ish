semantic_authority:
  source: ARM Architecture Reference Manual for A-profile
  register: TPIDR_EL0 - EL0 Read/Write Software Thread ID Register

abi_authority:
  source: Linux AArch64 ABI
  notes: |
    TPIDR_EL0 provides a location for system software to store
    thread-identifying information for EL0. The Linux kernel
    initializes this to point to the thread-local storage block.

toolchain_notes:
  runtime_verification: |
    This case uses inline assembly to read TPIDR_EL0.
    Tests verify initialization and accessibility.

platform_notes:
  linux: |
    TPIDR_EL0 points to a valid TLS block that can be
    dereferenced to access thread-local variables.

  macos: |
    TPIDR_EL0 is initialized but points to a system-
    managed structure. Direct dereferencing may not
    be safe; test verifies non-zero value only.

known_gaps:
  - TLS variable access not explicitly tested
  - Thread creation TLS setup not validated

non_authoritative_fields:
  - Exact TLS layout
  - Kernel thread structure details
