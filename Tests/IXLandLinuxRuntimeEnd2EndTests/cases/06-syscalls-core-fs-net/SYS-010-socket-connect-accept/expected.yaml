id: SYS-010
phase: 06-syscalls-core-fs-net

structural_expectations:
  exit_code: 0
  artifact_presence:
    - report.json
    - syscall_log.json

artifact_schema:
  report.json:
    required_fields:
      - case_id
      - phase
      - harness
      - passed
      - artifacts
      - timestamp
    passed_value: true

  syscall_log.json:
    required_fields:
      - case_id
      - syscall_count
      - log
    expected_syscalls:
      - socket
      - bind
      - listen
      - accept
      - connect

semantic_expectations:
  test_results:
    socket_creates_fd: passed
    bind_assigns_address: passed
    listen_enables_connections: passed
    connect_establishes_connection: passed
    accept_accepts_connection: passed
  syscall_behavior:
    socket_creates_valid_fd: true
    connect_establishes_connection: true
    bind_assigns_address: true
    listen_enables_connections: true
    accept_accepts_connections: true
