id: SYS-009
phase: 06-syscalls-core-fs-net

structural_expectations:
  exit_code: 0
  artifact_presence:
    - report.json
    - syscall_log.json

artifact_schema:
  report.json:
    required_fields:
      - case_id
      - phase
      - harness
      - passed
      - artifacts
      - timestamp
    passed_value: true

  syscall_log.json:
    required_fields:
      - case_id
      - syscall_count
      - log
    expected_syscalls:
      - poll
      - select
      - epoll_create
      - epoll_ctl
      - epoll_wait

semantic_expectations:
  test_results:
    poll_no_data_returns_0: passed
    poll_with_data_returns_ready: passed
    select_no_data_returns_0: passed
    select_with_data_returns_ready: passed
    epoll_create: passed
    epoll_ctl_add: passed
    epoll_wait: passed
  syscall_behavior:
    poll_detects_ready_fds: true
    select_monitors_fd_sets: true
    epoll_create_works: true
    epoll_ctl_works: true
    epoll_wait_works: true
