id: APP-005
phase: 02c-ios-app-runtime-entry
title: Login ELF Program Header Boundary
class: app_runtime_entry
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APP-005
prerequisites:
  - APP-004
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: elf-and-linux-abi
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "Login ELF header is parsed"
    - "Program headers are read"
    - "PT_LOAD segments are identified"
  semantic:
    - "ELF header is valid"
    - "Program headers are valid"
    - "Required segments are present"

allowed_patch_scope:
  - "tests/cases/02c-ios-app-runtime-entry/APP-005*/**"
  - "tests/cases/harness/ios_app_harness.c"

regression_target:
  meson_test: case:APP-005

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 300
  alive_check_interval: 5
  max_alive_wait: 60

milestone_model:
  ordered_milestones:
    - app_launched
    - boot_setup_started
    - first_elf_exec_entered
    - first_elf_exec_returned
    - second_execve_started
    - bin_login_elf_header_parsed
    - bin_login_program_headers_read

required_artifacts:
  - name: sim_launch.json
    type: json
  - name: login_elf_header.json
    type: json
  - name: program_headers.json
    type: json
  - name: report.json
    type: json

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Completes early app runtime-entry family - proves login ELF loading"
