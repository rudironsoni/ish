expected_artifacts:
  sim_launch.json:
    launch_success: true
    device_id: "string"
    bundle_id: "app.ish.iSH"
    
  boot_milestones.json:
    milestones:
      - name: "app_launched"
        reached: true
        timestamp: "ISO8601"
      - name: "boot_setup_started"
        reached: true
        timestamp: "ISO8601"
      - name: "first_elf_exec_entered"
        reached: true
        timestamp: "ISO8601"
    highest_completed: "string"
    
  first_elf_exec.json:
    first_elf_exec_entered: true
    milestone: "first_elf_exec_entered"
    status: "reached"
    
  report.json:
    case_id: "APP-001"
    status: "REAL_PASS"
    summary: "App launched and reached first ELF exec entry"

success_criteria:
  - "sim_launch.json contains launch_success: true"
  - "boot_milestones.json contains app_launched milestone"
  - "first_elf_exec.json contains first_elf_exec_entered: true"
  - "report.json contains status: REAL_PASS"
