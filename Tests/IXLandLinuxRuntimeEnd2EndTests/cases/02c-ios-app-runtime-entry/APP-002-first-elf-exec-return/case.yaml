id: APP-002
phase: 02c-ios-app-runtime-entry
title: First ELF Exec Return
class: app_runtime_entry
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APP-002
prerequisites:
  - APP-001
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: linux-aarch64-abi
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "First ELF exec completes"
    - "Return to caller is observed"
    - "Next phase of boot begins"
  semantic:
    - "first_elf_exec_returned milestone is reached"
    - "Exec return context is valid"

allowed_patch_scope:
  - "tests/cases/02c-ios-app-runtime-entry/APP-002*/**"
  - "tests/cases/harness/ios_app_harness.c"

regression_target:
  meson_test: case:APP-002

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 300
  alive_check_interval: 5
  max_alive_wait: 60

milestone_model:
  target_milestone: first_elf_exec_returned
  ordered_milestones:
    - app_launched
    - boot_setup_started
    - first_elf_exec_entered
    - first_elf_exec_returned

required_artifacts:
  - name: sim_launch.json
    type: json
  - name: boot_milestones.json
    type: json
  - name: first_elf_return.json
    type: json
  - name: report.json
    type: json

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Proves first ELF exec completes and returns"
