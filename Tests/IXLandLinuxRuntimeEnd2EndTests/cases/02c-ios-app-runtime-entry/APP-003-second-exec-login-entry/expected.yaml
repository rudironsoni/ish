expected_artifacts:
  sim_launch.json:
    launch_success: true
    device_id: "string"
    bundle_id: "app.ish.iSH"
    
  boot_milestones.json:
    milestones:
      - name: "app_launched"
        reached: true
        timestamp: "ISO8601"
      - name: "boot_setup_started"
        reached: true
        timestamp: "ISO8601"
      - name: "first_elf_exec_entered"
        reached: true
        timestamp: "ISO8601"
      - name: "first_elf_exec_returned"
        reached: true
        timestamp: "ISO8601"
      - name: "second_execve_started"
        reached: true
        timestamp: "ISO8601"
    highest_completed: "second_execve_started"
    first_failing: null
    
  second_exec.json:
    execve_path: "/bin/login"
    args: ["/bin/login", "-f", "root"]
    envp: []
    entered: true
    
  crash_signature.json:
    crashed: false
    normalized_signature_hash: null
    last_completed_milestone: "second_execve_started"
    first_failing_milestone: null
    termination_reason: "normal"
    
  report.json:
    case_id: "APP-003"
    status: "REAL_PASS"
    summary: "Second exec/login entry reached successfully"

# NOTE: This case MAY initially produce REAL FAIL with crash_signature.json
# containing crashed: true if the app crashes at or before this milestone.
# This is the expected behavior for the current crash class and enables
# milestone-first crash reduction.
