id: APP-004
phase: 02c-ios-app-runtime-entry
title: Process Entry Register Contract
class: app_runtime_entry
kind: ios_app_harness
harness: ios_app_harness
meson_test: case:APP-004
prerequisites:
  - APP-003
is_gate_case: true
informational_only: false

expectation_authority:
  semantic_source: linux-aarch64-abi
  primary_tool: XcodeBuildMCP

success_criteria:
  structural:
    - "Process entry state is captured"
    - "argc, argv, envp, auxv are valid"
    - "Stack and entry point are correct"
  semantic:
    - "Process entry contract matches Linux AArch64 ABI"
    - "No anomalies in register state"

allowed_patch_scope:
  - "tests/cases/02c-ios-app-runtime-entry/APP-004*/**"
  - "tests/cases/harness/ios_app_harness.c"

regression_target:
  meson_test: case:APP-004

harness_kind: ios_simulator_app
simulator_tool: xcodebuildmcp

retry_policy:
  max_retries: 1
  allow_reset: true
  reset_on_retry: true

timeout_policy:
  launch_timeout: 300
  alive_check_interval: 5
  max_alive_wait: 60

required_artifacts:
  - name: sim_launch.json
    type: json
  - name: process_entry.json
    type: json
  - name: argc_argv_envp.json
    type: json
  - name: auxv.json
    type: json
  - name: report.json
    type: json

metadata:
  created_date: "2026-03-28"
  last_modified: "2026-03-28"
  scaffolded: true
  implementation_ready: true
  notes: "Adjacent truth case for APP-003 - validates process entry contract"
