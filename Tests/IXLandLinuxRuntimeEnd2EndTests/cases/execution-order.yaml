    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 06-syscalls-core-fs-net
    name: System Calls - Core, Filesystem, Network
    description: |
      Validate core system call families: file I/O, process control,
      memory management, polling, sockets, and filesystem operations.
    gate_cases:
      - SYS-001
      - SYS-002
      - SYS-003
      - SYS-004
      - SYS-005
      - SYS-006
      - SYS-007
      - SYS-008
      - SYS-009
      - SYS-010
      - SYS-011
      - SYS-012
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 07-threads-signals-tls
    name: Threads, Signals, and TLS
    description: |
      Validate thread creation, synchronization primitives, signal
