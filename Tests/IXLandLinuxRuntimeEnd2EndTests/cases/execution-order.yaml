version: "3"

execution_policy: |
  Cases MUST execute in phase order. Within each phase, cases execute
  in alphanumeric order by case ID. Prerequisites within a phase form
  a DAG; cases with satisfied prerequisites execute first.
  
  Phase order is determined by the literal ordered sequence in this file's
  `phases` list, NOT by lexical sort or numeric parsing of phase IDs.
  Phase IDs are opaque strings; order is positional.
  
  Examples:
    - "02b" comes after "02" because it is position 4 in the list
    - "02c" comes after "02b" because it is position 5 in the list
    - "03" comes after "02c" because it is position 6 in the list
  
  AUTONOMOUS ACTIVE CASE SELECTION:
  1. Read this file to get the canonical phase order and gate inventory.
  2. Find the earliest phase whose gate cases are not all REAL PASS.
  3. Within that phase, find the earliest gate case that is not REAL PASS.
  4. That case becomes the ACTIVE CASE - the only case eligible for work.
  5. If the active case directory does not exist, scaffold it first.
  6. If the active case contract is invalid, repair it before implementation.
  7. Only work on the active case. Never skip phases. Never work on multiple cases.
  8. Skip deprecated legacy cases (exclude_from_selection: true).

phases:
  - phase: 00-trace-harness
    name: Trace Subsystem Validation
    description: |
      Validate the tracing subsystem before using it for debugging.
      These cases ensure trace capture, filtering, and dump mechanisms
      work correctly without source modifications.
    gate_cases:
      - TRACE-001
      - TRACE-002
      - TRACE-003
      - TRACE-004
      - TRACE-005
      - TRACE-006
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 01-decode
    name: Instruction Decode
    description: |
      Validate the AArch64 instruction decoder. Each case tests a
      specific instruction family or addressing mode. Expected values
      derived from Arm docs + LLVM + GNU binutils.
    gate_cases:
      - DEC-001
      - DEC-002
      - DEC-003
      - DEC-004
      - DEC-005
      - DEC-006
      - DEC-007
      - DEC-008
      - DEC-009
      - DEC-010
      - DEC-011
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 02-generator
    name: TCTI Code Generation
    description: |
      Validate the TCTI generator emits correct gadget sequences.
      Tests decoder output feeds into generator; generator output
      checked against architectural expectations.
    gate_cases:
      - GEN-001
      - GEN-002
      - GEN-003
      - GEN-004
      - GEN-005
      - GEN-006
      - GEN-007
      - GEN-008
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 02b-ios-simulator-harness
    name: iOS Simulator Harness Capability
    description: |
      Validate iOS simulator app testing harness capability.
      Prove XcodeBuildMCP availability, simulator targeting, build/install/launch,
      log harvesting, crash normalization, and bounded reset/retry.
      These cases make app testing lawful before later product phases complete.
    gate_cases:
      - APPSIM-001
      - APPSIM-002
      - APPSIM-003
      - APPSIM-004
      - APPSIM-005
      - APPSIM-006
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 02c-ios-app-runtime-entry
    name: iOS App Runtime-Entry
    description: |
      Reduce current crash class to earliest failing boot milestone.
      Prove first ELF exec, second exec/login entry, process-entry contract,
      and login ELF boundaries. These are early app runtime cases that can
      be lawfully run now to reduce the crash to smallest failing unit.
    gate_cases:
      - APP-001
      - APP-002
      - APP-003
      - APP-004
      - APP-005
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 03-semantic-exec
    name: Semantic Execution
    description: |
      Validate instruction execution semantics. Microtests exercise
      specific instruction sequences and verify register/memory state
      matches Arm architectural expectations.
    gate_cases:
      - EXEC-001
      - EXEC-002
      - EXEC-003
      - EXEC-004
      - EXEC-005
      - EXEC-006
      - EXEC-007
      - EXEC-008
      - EXEC-009
      - EXEC-010
      - EXEC-011
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 04-mmu-abi
    name: MMU and Linux ABI
    description: |
      Validate memory management and Linux AArch64 ABI compliance.
      Tests anonymous mmap, heap growth, stack layout, and process
      entry conventions.
    gate_cases:
      - MMU-001
      - MMU-002
      - MMU-003
      - MMU-004
      - MMU-005
      - MMU-006
      - ABI-001
      - ABI-002
      - ABI-003
      - ABI-004
      - ABI-005
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 05-elf-loader
    name: ELF and Dynamic Loader
    description: |
      Validate ELF parsing, PT_LOAD mapping, relocation application,
      and dynamic loader handoff. Tests static and dynamic binaries.
    gate_cases:
      - ELF-001
      - ELF-002
      - ELF-003
      - ELF-004
      - ELF-005
      - ELF-006
      - ELF-007
      - ELF-008
