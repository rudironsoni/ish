  - phase: 09-glibc
    name: glibc Compatibility
    description: |
      Validate compatibility with GNU libc (glibc).
      Tests Debian/Ubuntu package ecosystem compatibility.
    gate_cases:
      - GLIBC-001
      - GLIBC-002
      - GLIBC-003
      - GLIBC-004
      - GLIBC-005
      - GLIBC-006
      - GLIBC-007
      - GLIBC-008
      - GLIBC-009
      - GLIBC-010
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

  - phase: 11-distro-matrix
    name: Distribution Matrix
    description: |
      Validate compatibility across multiple Linux distributions.
      Alpine and Ubuntu package manager and core functionality tests.
    gate_cases:
      - DISTRO-001
      - DISTRO-002
      - DISTRO-003
      - DISTRO-004
    informational_only: false
    next_phase_prerequisite: all_gate_cases_pass

bootstrap_sequence:
  - TRACE-001
  - DEC-001
  - GEN-001
  - EXEC-001
  - EXEC-011
  - ABI-001
  - ELF-001

gating_rules: |
  STATUS VOCABULARY (use exactly these terms):
  - REAL PASS: Case executes and produces valid evidence matching expected.
  - REAL FAIL: Case executes but produces output that does not match expected.
  - STUB: Case directory exists but has no real implementation (scaffolded only).
  - BLOCKED: Case cannot execute because prerequisite case is not REAL PASS.
  - INVALID: Case contract is malformed or expectations are inconsistent.
  
  GATE ENFORCEMENT:
  1. Agent MUST NOT proceed to phase N+1 until all gate cases in phase N
     have status REAL PASS.
  2. A STUB is NOT REAL PASS. A STUB does NOT satisfy gate requirements.
  3. Informational-only phases do NOT gate subsequent phases.
  4. If a gate case fails (REAL FAIL), agent MUST debug and fix within the
     current phase before proceeding.
  5. Prerequisites within a phase MAY be satisfied out of order if
     the dependency DAG permits.
  6. Deprecated legacy cases with exclude_from_selection: true are NOT
     eligible for active case selection and do NOT count as gate cases.
  
  ILLEGAL OPERATIONS (agent MUST refuse):
  - Phase skipping: Never jump from phase N to phase N+M where M > 1.
  - Multi-case repair loops: Only one implementation-active case at a time.
  - Stub as pass: Never treat STUB or scaffolded-only state as REAL PASS.
  - Broad runtime debugging: If a smaller missing case can be created,
    create the case first instead of debugging the symptom.
  - Direct edits to generated outputs: Modify source, not artifacts.
  - Selecting deprecated legacy cases for active work.

