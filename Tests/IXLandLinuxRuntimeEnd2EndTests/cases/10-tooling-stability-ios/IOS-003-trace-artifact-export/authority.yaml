version: "2.0"

case_id: IOS-003
phase: 10-tooling-stability-ios

semantic_authority:
  source: ios-artifact-contract
  normative_reference: File system and trace export best practices
  description: |
    Validates that trace artifacts can be created, written, and
    read correctly. This is essential for iOS integration where
    trace files may need to be exported from the app sandbox
    for analysis.

toolchain_notes:
  - Creates test artifact in artifact directory
  - Writes timestamped content
  - Verifies artifact readability
  - Validates filesystem operations

expected_behavior:
  - Creates test artifact file
  - Writes content to file
  - Closes file successfully
  - Reopens and reads content
  - Passes if all operations succeed

known_gaps:
  - Does not test actual iOS document sharing
  - Does not test cloud export
  - Does not test large file handling
  - Limited to local filesystem

non_authoritative_fields:
  - Specific artifact filename
  - Timestamp format
  - Content of test artifact
