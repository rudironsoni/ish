version: "2.0"

case_id: TOOL-003
phase: 10-tooling-stability-ios

semantic_authority:
  source: version-control-contract
  normative_reference: Git documentation
  description: |
    Validates that Git version control is available and functional.
    Git is essential for source code management and distribution.
    Tests detection of git installation and basic repository info.

toolchain_notes:
  - Git is required for cloning the repository
  - Used for version tracking and release management
  - Repository detection provides context for test execution

expected_behavior:
  - Detects git installation
  - Reports git version when available
  - Detects if running within a git repository
  - Passes if git infrastructure is validated

known_gaps:
  - Does not test clone/push/pull operations
  - Does not verify remote connectivity
  - Branch detection is informational only

non_authoritative_fields:
  - Specific git version
  - Repository branch name
  - Remote URL
