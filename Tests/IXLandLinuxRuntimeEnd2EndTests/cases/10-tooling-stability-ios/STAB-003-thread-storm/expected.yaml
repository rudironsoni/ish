version: "2.0"

case_id: STAB-003
phase: 10-tooling-stability-ios
title: Rapid thread creation is stable

artifacts:
  tooling_log.json:
    description: JSON log of tooling events
    schema: tooling_event_log
    required: true
  report.json:
    description: Test execution report
    schema: case_report
    required: true

success_conditions:
  structural:
    - harness exits 0
    - report.json exists and is valid JSON
    - tooling_log.json exists and is valid JSON
  semantic:
    - report.passed is true
    - at least 50 threads created successfully
    - all created threads complete work and join
    - event log contains thread_storm_start and thread_storm_complete events
