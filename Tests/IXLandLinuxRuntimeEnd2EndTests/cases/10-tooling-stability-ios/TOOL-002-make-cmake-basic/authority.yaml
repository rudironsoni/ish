version: "2.0"

case_id: TOOL-002
phase: 10-tooling-stability-ios

semantic_authority:
  source: posix-toolchain-contract
  normative_reference: POSIX.1-2017, Meson Build System
  description: |
    Validates that build systems (make, cmake, meson) are available.
    This project uses Meson as its primary build system, so Meson
    availability is required for development.

toolchain_notes:
  - Meson is the primary build system for this project
  - Make is standard on all Unix-like systems
  - CMake is commonly used for C/C++ projects
  - Ninja is often used as Meson backend

expected_behavior:
  - Detects available build systems
  - Reports meson availability (required)
  - Reports make availability (standard)
  - Passes if meson is available

known_gaps:
  - Does not test actual build execution
  - Does not verify build system versions
  - Does not test cmake functionality

non_authoritative_fields:
  - Specific tool versions
  - Backend details (ninja vs make)
