version: "2.0"

case_id: STAB-002
phase: 10-tooling-stability-ios

semantic_authority:
  source: stability-contract
  normative_reference: POSIX.1-2017 process model
  description: |
    Validates that rapid fork/exec cycles are stable and do not
    exhaust system resources. Critical for emulation workloads
    that spawn many guest processes.

toolchain_notes:
  - Uses fork() and execve() directly
  - Tests 50 fork/exec cycles
  - Waits for each child to prevent zombies
  - Uses simple "true" command for speed

expected_behavior:
  - Creates child processes rapidly
  - All children execute successfully
  - Parent waits and reaps all children
  - No zombie processes remain

known_gaps:
  - Does not test exec failure paths
  - Limited to simple command execution
  - Does not stress file descriptor passing

non_authoritative_fields:
  - Specific iteration count (50)
  - Command used (true)
