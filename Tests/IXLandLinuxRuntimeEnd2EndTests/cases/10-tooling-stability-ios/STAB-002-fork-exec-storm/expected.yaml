version: "2.0"

case_id: STAB-002
phase: 10-tooling-stability-ios
title: Rapid fork/exec is stable

artifacts:
  tooling_log.json:
    description: JSON log of tooling events
    schema: tooling_event_log
    required: true
  report.json:
    description: Test execution report
    schema: case_report
    required: true

success_conditions:
  structural:
    - harness exits 0
    - report.json exists and is valid JSON
    - tooling_log.json exists and is valid JSON
  semantic:
    - report.passed is true
    - at least 50% of fork/exec cycles succeed
    - event log contains fork_exec_start and fork_exec_complete events
    - no process table exhaustion
