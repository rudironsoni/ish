case_id: DISTRO-001
phase: 11-distro-matrix
description: Alpine Linux minimal system boots and runs basic commands

expected_behavior:
  - Alpine Linux base system is detected
  - musl libc runtime is identified
  - Basic shell commands execute successfully
  - System information can be retrieved
  - Package manager (apk) is available and responsive

expected_artifacts:
  report.json:
    schema: case_report_v1
    required_fields:
      - case_id: "DISTRO-001"
      - phase: "11-distro-matrix"
      - harness: "distro_fixture"
      - passed: true
      - artifacts: ["distro_info.json", "report.json"]

  distro_info.json:
    schema: distro_info_v1
    required_fields:
      - distro_name: "Alpine Linux"
      - libc_type: "musl"
      - package_manager: "apk"

success_criteria:
  - Harness exits with code 0
  - report.json indicates passed: true
  - distro_info.json contains valid Alpine Linux identification
  - System is recognized as musl-based
