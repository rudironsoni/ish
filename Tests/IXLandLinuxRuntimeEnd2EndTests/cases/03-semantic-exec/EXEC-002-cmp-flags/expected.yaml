initial_state:
  registers:
    x0: 0x0000000000000005   # First operand value
    x1: 0x0000000000000003   # Second operand value (less than x0)
    x2: 0xFFFFFFFFFFFFFFFF   # Will test negative comparison
    x3: 0x0000000000000000   # Zero value
  pc: 0x0000000000001000
  sp: 0x00007FFF00000000
  nzcv: {n: 0, z: 0, c: 0, v: 0}

code:
  # CMP X0, X1 - sets flags based on X0 - X1
  # Encoding: SUBS XZR, X0, X1
  # This is: sf=1, op=1 (SUB), S=1, 100010, sh=0, imm12=0, Rn=0, Rd=31
  # Actually CMP with register: SUBS XZR, Xn, Xm
  # Using immediate version for simplicity: CMP X0, #3
  # CMP X0, #3 = SUBS XZR, X0, #3
  # Bits: sf=1, op=1, S=1, 100010, sh=0, imm12=000000000011, Rn=00000, Rd=11111
  # Hex: 0xF1000C1F (but this is subtract immediate)
  # Actually let's use: CMP X0, X1 = SUBS XZR, X0, X1
  # This is register form: sf=1, op=1, S=1, 1101011000...
  # Simplified: use SUBS immediate which is what we have
  instruction_1:
    name: cmp_imm
    asm: "cmp x0, #3"
    # SUBS immediate: sf=1, op=1 (SUB), S=1, 100010, sh=0, imm12, Rn, Rd=31
    # imm12=3, Rn=0, Rd=31 (XZR)
    # Binary: 1 1 1 100010 0 000000000011 00000 11111
    # Hex: 0xF1000C1F
    encoding_hex_le: "1f0c00f1"
    description: "CMP X0, #3 - compare 5 with 3, result positive, C=1"

execution_sequence:
  - step: 1
    instruction: cmp_imm
    description: "Compare X0 (5) with immediate 3"
    expected_registers:
      x0: 0x0000000000000005   # Unchanged
    expected_pc: 0x0000000000001004
    expected_nzcv:
      n: 0   # Result is positive (5 - 3 = 2)
      z: 0   # Result is not zero
      c: 1   # No borrow (5 >= 3)
      v: 0   # No overflow
    expected_tcti_exit_reason: 0  # TCTI_EXIT_NORMAL

codec_expectations:
  instruction_category: A64_DP_IMM
  instruction_subtype: 6   # SUB immediate no shift (or 5 with shift)
  set_flags: true
  operands:
    Rn: 0   # X0
    imm: 3  # Immediate value

semantic_effects:
  - operation: compare
    operands: [x0, immediate_3]
    result_flags:
      n: 0
      z: 0
      c: 1
      v: 0
    description: "Compare 5 with 3: positive result, no borrow, no overflow"

success_criteria:
  - registers unchanged except flags
  - nzcv flags correctly set
  - pc advanced by 4

notes: |
  Tests that CMP instruction correctly sets NZCV flags.
  CMP is an alias for SUBS XZR, Xn, #imm (immediate) or SUBS XZR, Xn, Xm (register).
  This case uses immediate form with known values.
