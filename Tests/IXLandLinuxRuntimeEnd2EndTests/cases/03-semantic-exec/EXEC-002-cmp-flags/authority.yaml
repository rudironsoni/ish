semantic_authority:
  source: ARM Architecture Reference Manual for A-profile
  section: "C6.2.72 CMP (immediate)"
  description: |
    CMP (immediate) is an alias for SUBS with destination XZR.
    Performs subtraction of immediate from register and updates flags.

  flag_computation:
    n: "Result bit 63 (sign bit)"
    z: "Result == 0"
    c: "No borrow (Rn >= imm)"
    v: "Signed overflow from subtraction"

  test_vectors:
    - { Rn: 5, imm: 3, n: 0, z: 0, c: 1, v: 0, desc: "positive result, no borrow" }
    - { Rn: 3, imm: 5, n: 1, z: 0, c: 0, v: 0, desc: "negative result, borrow" }
    - { Rn: 5, imm: 5, n: 0, z: 1, c: 1, v: 0, desc: "zero result" }

decode_authority:
  category: A64_DP_IMM
  subtype_mapping:
    6: "SUB immediate no shift (SUBS sets flags)"
    5: "SUB immediate with shift (SUBS sets flags)"
  set_flags: true

instruction_encoding:
  instruction: CMP Xn, #imm
  alias_of: "SUBS XZR, Xn, #imm"
  encoding: "sf=1, op=1, S=1, 100010, sh, imm12, Rn, Rd=11111"
  bits_31_21: "0b111_100010_xx"  # sf=1, op=1 (SUB), S=1, op0=010

stable_fields:
  - instruction_semantics
  - flag_update_behavior
  - nzcv_computation

out_of_scope:
  - register form of CMP
  - overflow detection edge cases
  - interaction with condition codes in subsequent instructions

toolchain_notes:
  llvm_mc: "clang -target aarch64 -c -o file.o file.s && objdump -d"
  gnu_objdump: "aarch64-linux-gnu-objdump -d"
