id: EXEC-014
phase: 03-semantic-exec
title: B.NE falls through when Z flag is set
class: semantic
kind: semantic_micro
harness: semantic_micro
meson_test: case:EXEC-014

prerequisites:
  - EXEC-012

expectation_authority:
  semantic_source: arm-a64
  primary_tool: llvm-mc

success_criteria:
  structural:
    - harness exits 0
  semantic:
    - B.NE with Z=1 falls through to next instruction
    - PC advances by 4 (not by branch offset)
    - Branch not taken

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit
  regs: [pc, nzcv]

informational_only: false
status: pending

metadata:
  scaffolded: true
  notes: |
    Critical: B.NE must fall through when Z=1 (equal).
    This is the interpreter loop exit condition.
