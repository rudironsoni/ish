initial_state:
  registers:
    x0: 0x00000000C0000000
  pc: 0x0000000000001000
  nzcv: {n: 0, z: 0, c: 0, v: 0}

code:
  instruction_1:
    name: msr_nzcv
    asm: "msr nzcv, x0"
    encoding_hex_le: "00421bd5"
    description: "MSR NZCV from X0 - sets N=1, Z=1, C=0, V=0"
  instruction_2:
    name: mrs_nzcv
    asm: "mrs x1, nzcv"
    encoding_hex_le: "01423bd5"
    description: "MRS NZCV to X1 - should read back same value"

execution_sequence:
  - step: 1
    instruction: msr_nzcv
    description: "Set NZCV from X0 (0xC0000000)"
    expected_nzcv:
      n: 1
      z: 1
      c: 0
      v: 0
  - step: 2
    instruction: mrs_nzcv
    description: "Read NZCV into X1"
    expected_registers:
      x1: 0x00000000C0000000

notes: |
  NZCV must roundtrip: MSR then MRS yields original value.
