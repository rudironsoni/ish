initial_state:
  registers:
    x0: 0x0000000000000005
    x1: 0x0000000000000003
  pc: 0x0000000000001000
  nzcv: {n: 0, z: 0, c: 0, v: 0}

code:
  instruction_1:
    name: cmp_reg
    asm: "cmp x0, x1"
    encoding_hex_le: "1f0000eb"
    description: "CMP X0, X1 - compare 5 with 3, sets Z=0"

execution_sequence:
  - step: 1
    instruction: cmp_reg
    description: "Compare 5 with 3"
    expected_nzcv:
      n: 0
      z: 0
      c: 1
      v: 0

notes: |
  CMP of unequal values must clear Z flag.
