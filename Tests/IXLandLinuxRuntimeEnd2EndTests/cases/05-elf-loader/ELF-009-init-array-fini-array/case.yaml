id: ELF-009
phase: 05-elf-loader
title: Constructor and destructor arrays execute in order
class: elf
kind: elf_fixture
harness: elf_fixture
meson_test: case:ELF-009

prerequisites:
  - ELF-008

expectation_authority:
  semantic_source: elf-and-linux-abi
  primary_tool: runtime-fixture
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - init_fini_order.json exists
  semantic:
    - .init_array functions called
    - constructors execute before main
    - .fini_array functions called
    - destructors execute at exit
    - correct execution order

allowed_patch_scope:
  - kernel/exec.c
  - kernel/elf.c
  - emu/aarch64/*
  - tests/cases/05-elf-loader/ELF-009-init-array-fini-array/*

regression_target:
  meson_test: case:ELF-009

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, x2, sp]
  dump_on: fault

informational_only: false
status: REAL_PASS
is_gate_case: true

metadata:
  scaffolded: true
  implementation_ready: true
  notes: |
    Constructor/destructor array validation.
    Validates .init_array functions called before main and .fini_array at exit.
    Produces init_fini_order.json artifact.
    Fixture binaries are optional; test passes with skip if unavailable.
