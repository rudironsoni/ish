elf_loading_requirements:
  binary_type: any
  architecture: aarch64

  loading_checks:
    - check: ELF header valid
      expected: magic bytes match 0x7f 'ELF'
    - check: init_array section
      expected: .init_array section present
    - check: fini_array section
      expected: .fini_array section present

  execution_requirements:
    - .init_array functions called
    - constructors execute before main
    - .fini_array functions called
    - destructors execute at exit
    - correct execution order

invariants:
  - "init_array functions execute in order before main"
  - "fini_array functions execute in reverse order at exit"
  - "Constructor priority respected"

validation_checks:
  - name: init_array_executed
    assertion: ".init_array functions called"
    critical: true

  - name: constructors_before_main
    assertion: "Constructors execute before main"
    critical: true

  - name: fini_array_executed
    assertion: ".fini_array functions called"
    critical: true

  - name: execution_order
    assertion: "Correct execution order maintained"
    critical: true

success_criteria:
  - Constructors execute before main
  - Destructors execute at exit
  - Execution order correct
