semantic_authority:
  source: ELF Specification v1.2
  url: https://refspecs.linuxfoundation.org/elf/elf.pdf

abi_authority:
  source: Linux AArch64 ABI
  notes: |
    .init_array and .fini_array sections contain arrays of
    function pointers to constructor and destructor functions.
    Constructors execute in order before main().
    Destructors execute in reverse order at exit.
    This replaces the older .init and .fini sections.

toolchain_notes:
  build_command: |
    __attribute__((constructor)) void init() { }
    __attribute__((destructor)) void fini() { }
  verification: |
    readelf -S <binary> shows .init_array and .fini_array

known_gaps:
  - Full constructor/destructor execution requires runtime
  - Priority ordering not extensively tested

non_authoritative_fields:
  - Specific section addresses
  - Number of constructor/destructor functions
