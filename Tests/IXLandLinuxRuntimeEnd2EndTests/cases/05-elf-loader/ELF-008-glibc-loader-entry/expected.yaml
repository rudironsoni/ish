elf_loading_requirements:
  binary_type: dynamic
  architecture: aarch64
  loader: glibc

  loading_checks:
    - check: ELF header valid
      expected: magic bytes match 0x7f 'ELF'
    - check: glibc interpreter
      expected: PT_INTERP points to ld-linux

  execution_requirements:
    - glibc loader executes
    - _dl_start runs
    - shared libraries loaded
    - transfers to program entry

invariants:
  - "glibc loader starts at _dl_start"
  - "Shared dependencies loaded recursively"
  - "Symbol resolution completed before transfer"

validation_checks:
  - name: loader_executes
    assertion: "glibc loader code executes"
    critical: true

  - name: dl_start_runs
    assertion: "_dl_start entry point reached"
    critical: true

  - name: libraries_loaded
    assertion: "Shared libraries loaded successfully"
    critical: true

  - name: transfer_successful
    assertion: "Control transferred to program"
    critical: true

success_criteria:
  - glibc loader initializes successfully
  - Shared libraries loaded
  - Program executes
