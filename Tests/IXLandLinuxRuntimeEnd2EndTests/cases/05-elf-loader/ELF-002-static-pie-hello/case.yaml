id: ELF-002
phase: 05-elf-loader
title: Static PIE binary loads and executes correctly
class: elf
kind: elf_fixture
harness: elf_fixture
meson_test: case:ELF-002

prerequisites:
  - ELF-001

expectation_authority:
  semantic_source: elf-and-linux-abi
  primary_tool: runtime-fixture
  secondary_tool: llvm-objdump
  tertiary_tool: aarch64-linux-gnu-objdump

success_criteria:
  structural:
    - harness exits 0
    - report.json exists and valid
    - load_map.json exists
  semantic:
    - binary loads without fault
    - reaches _start at correct offset
    - executes to exit
    - exit code 0

allowed_patch_scope:
  - kernel/exec.c
  - kernel/elf.c
  - emu/aarch64/*
  - tests/cases/05-elf-loader/ELF-002-static-pie-hello/*

regression_target:
  meson_test: case:ELF-002

trace_defaults:
  backend: ring
  level: 2
  events: block.entry,block.exit,fault
  pc_range: null
  regs: [x0, x1, x2, x3, x4, sp]
  dump_on: fault

informational_only: false
status: REAL_PASS
is_gate_case: true

metadata:
  scaffolded: true
  implementation_ready: true
  notes: |
    Static PIE binary validation.
    Validates ET_DYN type, absence of PT_INTERP, and position-independent code.
    Fixture binaries are optional; test passes with skip if unavailable.
