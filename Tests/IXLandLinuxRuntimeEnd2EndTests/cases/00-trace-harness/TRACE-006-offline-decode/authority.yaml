version: 1

# Authority chain for TRACE-006-offline-decode expectations
# Defines where normative expectations come from

semantic_source: internal-trace-contract

authority_chain:
  tier_0:
    source: "internal-trace-contract"
    description: "Repository-internal trace subsystem contract"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      - "trace/*"
    
  tier_1:
    source: "harness-implementation"
    description: "Runtime trace harness reference implementation with offline decoding"
    documents:
      - "tests/cases/harness/runtime_trace.c"
      
  tier_2:
    source: "case-contract"
    description: "This case's contract definition for offline decoding"
    documents:
      - "tests/cases/00-trace-harness/TRACE-006-offline-decode/case.yaml"

expectation_provenance:
  - expectation: "trace.ring is decodable in offline mode"
    source: "harness-implementation"
    verification: "structural check"
    
  - expectation: "decoded_trace.txt is produced from offline decode"
    source: "harness-implementation"
    verification: "structural check"
    
  - expectation: "report.json includes offline_decode_enabled field"
    source: "harness-implementation"
    verification: "schema validation"
    
  - expectation: "offline decode produces valid human-readable output"
    source: "internal-trace-contract"
    verification: "semantic validation"
    
  - expectation: "all trace events are decoded without errors"
    source: "internal-trace-contract"
    verification: "semantic validation"

generation_method: |
  Expectations derived from harness implementation contract.
  Not from runtime behavior observation.
  
regeneration_steps: |
  1. Review harness implementation in tests/cases/harness/runtime_trace.c
  2. Verify offline decode logic and output formatting
  3. Update expectations to match harness contract for offline decoding

