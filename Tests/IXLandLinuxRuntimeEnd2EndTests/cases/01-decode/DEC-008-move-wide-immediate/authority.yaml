semantic_source:
  family: arm-a64
  reference_url: https://developer.arm.com/documentation/ddi0602/latest
  section: C6.2.167 (MOVZ), C6.2.166 (MOVN), C6.2.165 (MOVK)
  notes: |
    Move Wide (Immediate) encoding:
    - bit 31: sf (0=32-bit, 1=64-bit)
    - bits 30:23: 100101xx (0xA4-0xA7)
    - bits 30:29: opc (00=MOVN, 10=MOVZ, 11=MOVK)
    - bit 22: N (must be 0 for move wide)
    - bits 21:5: imm16 (16-bit immediate)
    - bits 4:0: Rd (destination register)
    - For 64-bit: hw (bits 22:21) = shift amount / 16 (0-3)
    - For 32-bit: hw (bit 22) = shift amount / 16 (0-1)

    Operation:
    - MOVZ: Rd = imm16 << (hw * 16), zero upper bits
    - MOVN: Rd = ~(imm16 << (hw * 16)), zero upper bits
    - MOVK: Rd[hw*16+15 : hw*16] = imm16, keep other bits

encoding_source:
  tool: llvm-mc
  version: 22.1.1
  command: |
    llvm-mc --triple=aarch64-linux-gnu --show-encoding
  derived_encodings:
    movz_x0_0x1234: "804682d2"      # movz x0, #0x1234: [0x80,0x46,0x82,0xd2]
    movn_x1_0xffff: "e1ff9f92"      # movn x1, #0xffff: [0xe1,0xff,0x9f,0x92]
    movk_x2_0xabcd_lsl16: "a279b5f2" # movk x2, #0xabcd, lsl #16: [0xa2,0x79,0xb5,0xf2]
    movz_w3_0xff: "e31f8052"        # movz w3, #0xff: [0xe3,0x1f,0x80,0x52]
    movn_w4_0x0: "04008012"         # movn w4, #0x0: [0x04,0x00,0x80,0x12]
    movk_w5_0x1234: "85468272"      # movk w5, #0x1234: [0x85,0x46,0x82,0x72]

decode_primary:
  tool: llvm-objdump
  version: 22.1.1

tools_agree: true
verification_date: "2026-03-27"
verified_by: agent
notes: |
  Six test vectors covering:
  - MOVZ with 64-bit register, hw=0
  - MOVZ with 32-bit register, hw=0
  - MOVN with 64-bit register, hw=0
  - MOVN with 32-bit register, hw=0 (creates -1)
  - MOVK with 64-bit register, hw=1 (lsl #16)
  - MOVK with 32-bit register, hw=0
