vectors:
  # Load/Store with unsigned immediate offset
  - name: ldr_x0_sp_0
    asm: "ldr x0, [sp]"
    encoding_hex_le: "e00340f9"
    canonical_disasm: "ldr x0, [sp]"
    expected_decode:
      category: 12  # A64_LD_ST
      subtype: 1  # Single register
      rd: 0  # Destination register
      rn: 31  # Base register (sp)
      imm: 0  # Immediate offset
      is_64bit: true
      is_signed: false
      set_flags: false

  - name: str_x1_sp_8
    asm: "str x1, [sp, #8]"
    encoding_hex_le: "e10700f9"
    canonical_disasm: "str x1, [sp, #8]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 1
      rn: 31
      imm: 8
      is_64bit: true
      is_signed: false
      set_flags: false

  - name: ldr_w2_sp_16
    asm: "ldr w2, [sp, #16]"
    encoding_hex_le: "e20340b9"
    canonical_disasm: "ldr w2, [sp, #16]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 2
      rn: 31
      imm: 16
      is_64bit: false
      is_signed: false
      set_flags: false

  - name: str_w3_sp_4
    asm: "str w3, [sp, #4]"
    encoding_hex_le: "e30700b9"
    canonical_disasm: "str w3, [sp, #4]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 3
      rn: 31
      imm: 4
      is_64bit: false
      is_signed: false
      set_flags: false

  # Load Literal (PC-relative)
  - name: ldr_x4_lit
    asm: "ldr x4, #0"
    encoding_hex_le: "04000058"
    canonical_disasm: "ldr x4, #0"
    expected_decode:
      category: 12
      subtype: 4  # Load literal
      rd: 4
      rn: 31  # PC is implicit
      imm: 0
      is_64bit: true
      is_signed: false
      set_flags: false

  # Load/Store Pair
  - name: ldp_x5_x6_sp
    asm: "ldp x5, x6, [sp]"
    encoding_hex_le: "e50b40a9"
    canonical_disasm: "ldp x5, x6, [sp]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 5
      rn: 31
      imm: 0
      is_64bit: true
      is_pair: true
      set_flags: false

  - name: stp_x7_x8_sp_16
    asm: "stp x7, x8, [sp, #16]"
    encoding_hex_le: "e78f00a9"
    canonical_disasm: "stp x7, x8, [sp, #16]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 7
      rn: 31
      imm: 16
      is_64bit: true
      is_pair: true
      set_flags: false

  - name: ldp_w9_w10_sp
    asm: "ldp w9, w10, [sp]"
    encoding_hex_le: "e90b4029"
    canonical_disasm: "ldp w9, w10, [sp]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 9
      rn: 31
      imm: 0
      is_64bit: false
      is_pair: true
      set_flags: false

  - name: stp_w11_w12_sp_8
    asm: "stp w11, w12, [sp, #8]"
    encoding_hex_le: "eb470029"
    canonical_disasm: "stp w11, w12, [sp, #8]"
    expected_decode:
      category: 12
      subtype: 1
      rd: 11
      rn: 31
      imm: 8
      is_64bit: false
      is_pair: true
      set_flags: false

success_threshold: 10
