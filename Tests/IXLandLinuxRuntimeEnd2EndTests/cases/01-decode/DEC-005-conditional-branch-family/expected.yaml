vectors:
  # Conditional branch instructions - b.cond
  # All target +0x100 (256), with different condition codes
  - name: beq_0x100
    asm: "b.eq #0x100"
    encoding_hex_le: "00080054"
    canonical_disasm: "b.eq #256"
    expected_decode:
      category: 10  # A64_BRANCH
      subtype: 0  # Conditional branch
      target: 256  # Sign-extended imm19 << 2
      cond: 0  # EQ
      set_flags: false

  - name: bne_0x100
