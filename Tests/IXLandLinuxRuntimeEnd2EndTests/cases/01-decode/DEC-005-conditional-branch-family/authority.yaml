    bcc_0x100: "03080054"    # b.cc #0x100: [0x03,0x08,0x00,0x54]
    bmi_0x100: "04080054"    # b.mi #0x100: [0x04,0x08,0x00,0x54]
    bpl_0x100: "05080054"    # b.pl #0x100: [0x05,0x08,0x00,0x54]
    bvs_0x100: "06080054"    # b.vs #0x100: [0x06,0x08,0x00,0x54]
    bvc_0x100: "07080054"    # b.vc #0x100: [0x07,0x08,0x00,0x54]
