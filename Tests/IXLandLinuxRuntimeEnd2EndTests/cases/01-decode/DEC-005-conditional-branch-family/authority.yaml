semantic_source:
  family: arm-a64
  reference_url: https://developer.arm.com/documentation/ddi0602/latest
  section: C6.2.25 (B.cond)
  notes: |
    Conditional Branch encoding:
    - bits 31:24: 01010100 (0x54)
    - bit 4: 0 (b.cond identifier)
    - bits 23:5: imm19 (signed PC-relative offset / 4)
    - bits 3:0: cond (condition code)
    - Target = PC + (sign_extend(imm19, 19) << 2)

    Condition codes (bits 3:0):
    - 0x0: EQ - Equal (Z=1)
    - 0x1: NE - Not Equal (Z=0)
    - 0x2: CS/HS - Carry Set / Unsigned Higher or Same (C=1)
    - 0x3: CC/LO - Carry Clear / Unsigned Lower (C=0)
    - 0x4: MI - Minus / Negative (N=1)
    - 0x5: PL - Plus / Positive or Zero (N=0)
    - 0x6: VS - Overflow Set (V=1)
    - 0x7: VC - Overflow Clear (V=0)
    - 0x8: HI - Unsigned Higher (C=1 && Z=0)
    - 0x9: LS - Unsigned Lower or Same (C=0 || Z=1)
    - 0xA: GE - Signed Greater or Equal (N=V)
    - 0xB: LT - Signed Less Than (N!=V)
    - 0xC: GT - Signed Greater Than (Z=0 && N=V)
    - 0xD: LE - Signed Less or Equal (Z=1 || N!=V)
    - 0xE: AL - Always
    - 0xF: NV - Always (Reserved)

encoding_source:
  tool: llvm-mc
  version: 22.1.1
  command: |
    llvm-mc --triple=aarch64-linux-gnu --show-encoding
  derived_encodings:
