semantic_source:
  family: arm-a64
  reference_url: https://developer.arm.com/documentation/ddi0602/latest
  section: C6.2.24 (B), C6.2.26 (BL), C6.2.28 (BR), C6.2.30 (BLR), C6.2.218 (RET)
  notes: |
    Unconditional Branch Immediate encoding:
    - bit 31: op (0=B, 1=BL)
    - bits 30:26: 00101 (0x05)
    - bits 25:0: imm26 (signed PC-relative offset / 4)
    - Target = PC + (sign_extend(imm26, 26) << 2)

    Unconditional Branch (register) encoding:
    - bits 31:25: 1101011 (0x6B)
    - bits 24:21: opc (0000=BR, 0001=BLR, 0010=RET)
    - bits 20:16: op2 (must be 11111 for BR/BLR/RET)
    - bits 15:10: must be 000000 for BR/BLR/RET
    - bits 9:5: Rn (register number)
    - bits 4:0: must be 00000

encoding_source:
  tool: llvm-mc
  version: 22.1.1
  command: |
    llvm-mc --triple=aarch64-linux-gnu --show-encoding
  derived_encodings:
    # Unconditional branch immediate
    b_imm_0x100: "40000014"       # b #0x100: [0x40,0x00,0x00,0x14]
    bl_imm_0x200: "80000094"      # bl #0x200: [0x80,0x00,0x00,0x94]
    # Unconditional branch register
    br_x0: "00001fd6"             # br x0: [0x00,0x00,0x1f,0xd6]
    blr_x1: "20003fd6"            # blr x1: [0x20,0x00,0x3f,0xd6]
    ret: "c0035fd6"                # ret: [0xc0,0x03,0x5f,0xd6]

decode_primary:
  tool: llvm-objdump
  version: 22.1.1

tools_agree: true
verification_date: "2026-03-27"
verified_by: agent
notes: |
  Five test vectors covering:
  - B (branch) with 26-bit immediate offset
  - BL (branch with link) with 26-bit immediate offset
  - BR (branch register)
  - BLR (branch with link register)
  - RET (return to link register)
