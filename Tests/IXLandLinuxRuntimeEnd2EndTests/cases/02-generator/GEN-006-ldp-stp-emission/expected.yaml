input_instructions:
  - name: ldp_x0_x1_sp
    asm: "ldp x0, x1, [sp]"
    encoding_hex_le: "e00b40a9"
    pc: 0x3000

  - name: stp_x2_x3_sp_16
    asm: "stp x2, x3, [sp, #16]"
    encoding_hex_le: "e28f00a9"
    pc: 0x3004

  - name: ldp_x4_x5_sp_post_16
    asm: "ldp x4, x5, [sp], #16"
    encoding_hex_le: "e48b40a8"
    pc: 0x3008

  - name: stp_x6_x7_sp_pre_16
    asm: "stp x6, x7, [sp, #16]!"
    encoding_hex_le: "e68fc0a9"
    pc: 0x300c

  - name: ldp_w8_w9_sp
    asm: "ldp w8, w9, [sp]"
    encoding_hex_le: "e80b4029"
    pc: 0x3010

  - name: stp_w10_w11_sp_8
    asm: "stp w10, w11, [sp, #8]"
    encoding_hex_le: "ea470029"
    pc: 0x3014

  - name: ldp_w12_w13_sp_post_8
    asm: "ldp w12, w13, [sp], #8"
    encoding_hex_le: "ec4b4028"
    pc: 0x3018

  - name: stp_w14_w15_sp_pre_8
    asm: "stp w14, w15, [sp, #8]!"
    encoding_hex_le: "ee47c029"
    pc: 0x301c

generator_expectations:
  ldp_x0_x1_sp:
    architectural_effect:
      - "x0 := mem[sp + 0]"
      - "x1 := mem[sp + 8]"
      - "sp unchanged"

    emitted_sequence:
      - gadget: load_base
        description: Load SP value into host scratch
        guest_base: 31
        host_temp: x14
      - gadget: load_pair
        description: Load 64-bit register pair from memory
        guest_rt: 0
        guest_rt2: 1
        host_rt: x1
        host_rt2: x2
        base: x14
        offset: 0

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 2
      has_branch: false
      is_pair: true
      addressing_mode: offset
      writes_flags: false

  stp_x2_x3_sp_16:
    architectural_effect:
      - "mem[sp + 16] := x2"
      - "mem[sp + 24] := x3"
      - "sp unchanged"

    emitted_sequence:
      - gadget: load_base
        description: Load SP value into host scratch
        guest_base: 31
        host_temp: x14
      - gadget: add_offset
        description: Add immediate offset to base
        host_base: x14
        host_temp: x15
        offset: 16
      - gadget: store_pair
        description: Store 64-bit register pair to memory
        guest_rt: 2
        guest_rt2: 3
        host_rt: x3
        host_rt2: x4
        base: x15
        offset: 0

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 3
      has_branch: false
      is_pair: true
      addressing_mode: offset
      writes_flags: false

  ldp_x4_x5_sp_post_16:
    architectural_effect:
      - "x4 := mem[sp]"
      - "x5 := mem[sp + 8]"
      - "sp := sp + 16"

    emitted_sequence:
      - gadget: load_base
        description: Load SP value into host scratch
        guest_base: 31
        host_temp: x14
      - gadget: load_pair
        description: Load 64-bit register pair from memory
        guest_rt: 4
        guest_rt2: 5
        host_rt: x5
        host_rt2: x6
        base: x14
        offset: 0
      - gadget: add_imm
        description: Update SP with post-index offset
        guest_dst: 31
        guest_src: 31
        host_dst: x19
        host_src: x19
        imm: 16

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 3
      has_branch: false
      is_pair: true
      addressing_mode: post_index
      writes_flags: false
      updates_base: true
      post_index_offset: 16

  stp_x6_x7_sp_pre_16:
    architectural_effect:
      - "sp := sp + 16"
      - "mem[sp] := x6"
      - "mem[sp + 8] := x7"

