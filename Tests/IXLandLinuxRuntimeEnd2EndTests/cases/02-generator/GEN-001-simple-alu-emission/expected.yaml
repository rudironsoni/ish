input_instruction:
  name: add_x0_x1_imm1
  asm: "add x0, x1, #1"
  encoding_hex_le: "20040091"

generator_expectation:
  architectural_effect:
    - "x0 := x1 + 1"

  # For small immediates (imm <= 15) with hot registers (x0-x15),
  # the generator emits a single optimized gadget_add_imm that:
  # - Loads source register from host register (already hot)
  # - Adds immediate in one host instruction
  # - Stores result to destination host register (already hot)
  # This is more efficient than separate load/add/store gadgets.
  emitted_sequence:
    - gadget: add_imm
      description: Add immediate using single TCTI gadget (optimized for small immediates with hot registers)
      guest_src_reg: 1
      guest_dst_reg: 0
      imm: 1
      host_src: x2
      host_dst: x1

  register_allocation:
    guest_x0: host_x1
    guest_x1: host_x2
    scratch: host_x14

  sidecar_metadata:
    instruction_count: 1
    gadget_count: 1
    has_branch: false
    writes_flags: false
    optimization: single_gadget_for_small_immediate

success_criteria:
  - emitted_sequence produces correct architectural_effect
  - register_allocation uses hot register mapping
  - sidecar_metadata valid
  - generator produces optimized sequence (1 gadget for imm <= 15)
