input_instruction:
  name: str_x1_x2_post_plus8
  asm: "str x1, [x2], #8"
  encoding_hex_le: "410400f8"
  addressing_mode: post-index

instruction_details:
  size: 64-bit
  source_reg: 1    # x1
  base_reg: 2      # x2
  offset: 8        # +8
  writeback: true

generator_expectation:
  architectural_effect:
    - "Mem[x2] := x1"
    - "x2 := x2 + 8"

  emitted_sequence:
    - gadget: load_guest_base
      description: Load guest base register x2 from hot host register x3
      guest_base_reg: 2
      host_base: x3

    - gadget: store_guest_data
      description: Store guest x1 to memory at [base]
      guest_data_reg: 1
      host_data: x2

    - gadget: add_imm_base
      description: Add immediate #8 to base register
      imm: 8
      host_base: x3

    - gadget: store_guest_base
      description: Store updated base back to guest x2
      guest_base_reg: 2
      host_base: x3

  register_allocation:
    guest_x1: host_x2
    guest_x2: host_x3
    scratch: host_x14

  sidecar_metadata:
    instruction_count: 1
    gadget_count: 4
    has_memory_op: true
    has_writeback: true
    addressing_mode: post-index

success_criteria:
  - emitted_sequence performs store-then-update semantics
  - base register updated correctly after store
  - register_allocation uses hot register mapping
  - sidecar_metadata valid
