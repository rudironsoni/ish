semantic_source:
  family: arm-a64
  reference_url: https://developer.arm.com/documentation/ddi0602/latest
  section: C6.2.242 (STR immediate)

encoding_source:
  tool: llvm-mc
  reference_url: https://llvm.org/docs/CommandGuide/llvm-mc.html
  command: |
    echo "str x1, [x2], #8" | llvm-mc --triple=aarch64-linux-gnu --show-encoding --show-inst

decode_primary:
  tool: llvm-objdump
  reference_url: https://llvm.org/docs/CommandGuide/llvm-objdump.html
  command: |
    llvm-objdump -d --arch-name=aarch64 --disassembler-options=no-aliases test.o

decode_secondary:
  tool: aarch64-linux-gnu-objdump
  reference_url: https://sourceware.org/binutils/docs/binutils/objdump.html
  command: |
    aarch64-linux-gnu-objdump -d -M no-aliases test.o

tools_agree: true
verification_date: "2024-01-15"
verified_by: agent

notes: |
  STR (post-index) stores register to memory, then updates base register.
  Encoding: size=11 (64-bit), V=0, M=0 (post-index), Rn=base, Rt=source

  Post-index addressing: Mem[base] = Rt, base = base + offset

  TCTI generator must:
  - Calculate effective address from base register
  - Store source register to memory at that address
  - Update base register with post-index offset
  - Handle both positive and negative offsets

  For STR x1, [x2], #8:
  - Read x2 (base) from hot host register
  - Calculate address
  - Read x1 (data) from hot host register
  - Store to memory
  - Update x2 = x2 + 8
