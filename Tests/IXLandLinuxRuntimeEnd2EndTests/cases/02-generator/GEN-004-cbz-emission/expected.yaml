input_instructions:
  - name: cbz_x0_loop_exit
    asm: "cbz x0, #0x100"
    encoding_hex_le: "000800b4"
    pc: 0x1000

  - name: cbnz_x1_next_iter
    asm: "cbnz x1, #0x100"
    encoding_hex_le: "010800b5"
    pc: 0x1004

  - name: cbz_w4_forward
    asm: "cbz w4, #0x200"
    encoding_hex_le: "80100034"
    pc: 0x1008

  - name: cbnz_w5_forward
    asm: "cbnz w5, #0x200"
    encoding_hex_le: "81100035"
    pc: 0x100c

generator_expectations:
  cbz_x0_loop_exit:
    architectural_effect:
      - "if x0 == 0 then PC := 0x1100 else PC := 0x1004"

    emitted_sequence:
      - gadget: test_register
        description: Test if register is zero
        guest_reg: 0
        host_reg: x1
        result: flags
      - gadget: branch_cond
        description: Branch if zero flag set
        condition: eq
        target_guest_pc: 0x1100
        target_offset: 0x100

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 2
      has_branch: true
      is_conditional_branch: true
      branch_type: cbz
      writes_flags: false
      fallthrough_pc: 0x1004

  cbnz_x1_next_iter:
    architectural_effect:
      - "if x1 != 0 then PC := 0x1108 else PC := 0x1008"

    emitted_sequence:
      - gadget: test_register
        description: Test if register is zero
        guest_reg: 1
        host_reg: x2
        result: flags
      - gadget: branch_cond
        description: Branch if not zero
        condition: ne
        target_guest_pc: 0x1108
        target_offset: 0x100

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 2
      has_branch: true
      is_conditional_branch: true
      branch_type: cbnz
      writes_flags: false
      fallthrough_pc: 0x1008

  cbz_w4_forward:
    architectural_effect:
      - "if w4 == 0 then PC := 0x120c else PC := 0x100c"

    emitted_sequence:
      - gadget: test_register_32
        description: Test if 32-bit register is zero
        guest_reg: 4
        host_reg: x5
        result: flags
      - gadget: branch_cond
        description: Branch if zero flag set
        condition: eq
        target_guest_pc: 0x120c
        target_offset: 0x200

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 2
      has_branch: true
      is_conditional_branch: true
      branch_type: cbz
      is_32bit: true
      writes_flags: false
      fallthrough_pc: 0x100c

  cbnz_w5_forward:
    architectural_effect:
      - "if w5 != 0 then PC := 0x1210 else PC := 0x1010"

    emitted_sequence:
      - gadget: test_register_32
        description: Test if 32-bit register is zero
        guest_reg: 5
        host_reg: x6
        result: flags
      - gadget: branch_cond
        description: Branch if not zero
        condition: ne
        target_guest_pc: 0x1210
        target_offset: 0x200

    sidecar_metadata:
      instruction_count: 1
      gadget_count: 2
      has_branch: true
      is_conditional_branch: true
      branch_type: cbnz
      is_32bit: true
      writes_flags: false
      fallthrough_pc: 0x1010

success_criteria:
  - emitted_sequence produces correct architectural_effect
  - branch targets are correctly calculated from PC + offset
  - 32-bit and 64-bit register variants handled correctly
  - sidecar metadata correctly identifies branch type
  - generator produces 2 gadgets per CBZ/CBNZ (test + branch)

success_threshold: 4
