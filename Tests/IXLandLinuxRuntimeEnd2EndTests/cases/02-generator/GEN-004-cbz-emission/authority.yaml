semantic_source:
  family: arm-a64
  reference_url: https://developer.arm.com/documentation/ddi0602/latest
  section: C6.2.34 (CBZ/CBNZ)
  notes: |
    Compare and Branch on Zero/Non-Zero (CBZ/CBNZ) encoding:
    - bit 31: sf (0=32-bit W register, 1=64-bit X register)
    - bits 30:25: 011010 (0x1A) for CBZ/CBNZ
    - bit 24: op (0=CBZ, 1=CBNZ)
    - bits 23:5: imm19 (signed PC-relative offset / 4)
    - bits 4:0: Rt (register to test)
    - Target = PC + (sign_extend(imm19, 19) << 2)

    Branch range: +/- 1MB (imm19: -2^18 to +2^18-1, scaled by 4)

encoding_source:
  tool: llvm-mc
  version: 22.1.1
  command: |
    llvm-mc --triple=aarch64-linux-gnu --show-encoding
  derived_encodings:
    # CBZ/CBNZ with 64-bit registers (sf=1, base opcode 0xB4)
    cbz_x0_0x100: "000800b4"     # cbz x0, #0x100: [0x00,0x08,0x00,0xb4]
    cbnz_x1_0x100: "010800b5"    # cbnz x1, #0x100: [0x01,0x08,0x00,0xb5]
    cbz_x2_forward_1m: "00f07fb4" # cbz x2, #+1MB (max forward)
    cbnz_x3_back_1m: "00f0ffb5"  # cbnz x3, #-1MB (max backward)
    # CBZ/CBNZ with 32-bit registers (sf=0, base opcode 0x34)
    cbz_w4_0x200: "80100034"     # cbz w4, #0x200: [0x80,0x10,0x00,0x34]
    cbnz_w5_0x200: "81100035"    # cbnz w5, #0x200: [0x81,0x10,0x00,0x35]
    cbz_w6_0: "00000034"         # cbz w6, #0: [0x00,0x00,0x00,0x34]
    cbnz_w7_0: "01000035"        # cbnz w7, #0: [0x01,0x00,0x00,0x35]

decode_primary:
  tool: llvm-objdump
  version: 22.1.1

tools_agree: true
verification_date: "2026-03-27"
verified_by: agent
notes: |
  Eight test vectors covering:
  - CBZ with 64-bit register, forward branch (+256 bytes)
  - CBNZ with 64-bit register, forward branch (+256 bytes)
  - CBZ with 64-bit register, max forward branch (+1MB)
  - CBNZ with 64-bit register, max backward branch (-1MB)
  - CBZ with 32-bit register, forward branch (+512 bytes)
  - CBNZ with 32-bit register, forward branch (+512 bytes)
  - CBZ with 32-bit register, zero offset
  - CBNZ with 32-bit register, zero offset

  CBZ/CBNZ are used for hot-loop exits and null checks.
  The generator must emit:
  1. Register test (using TCTI comparison gadget)
  2. Conditional branch (using TCTI branch gadget)
  3. Sidecar entry mapping guest PC to host branch
