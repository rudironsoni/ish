commands:
  install: echo "iOS project - no install needed"
  build: xcodebuild -project iSH.xcodeproj -scheme iSH -sdk iphonesimulator -configuration Debug build
  test: xcodebuild -project iSH.xcodeproj -scheme iSH -sdk iphonesimulator -configuration Debug test
  typecheck: echo "Objective-C/Swift - typecheck via xcodebuild"
  lint: echo "C/Objective-C code - lint via compiler warnings"

services:
  ios-simulator:
    start: echo "Booting iOS simulator via XcodeBuildMCP"
    stop: echo "Stopping iOS simulator"
    healthcheck: xcrun simctl list devices | grep "Booted"
    port: 0
    depends_on: []
