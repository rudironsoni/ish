commands:
  install: meson setup builddir
  build: meson compile -C builddir
  test: meson test -C builddir
  typecheck: echo "C code - no typecheck"
  lint: echo "C code - lint via compiler warnings"

services:
  ios-simulator:
    start: echo "Booting iOS simulator via XcodeBuildMCP"
    stop: echo "Stopping iOS simulator"
    healthcheck: xcrun simctl list devices | grep "Booted"
    port: 0
    depends_on: []
