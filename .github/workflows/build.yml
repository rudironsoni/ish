name: Build & Test

on:
  push:
    branches: [ master, feat/*, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # Linux tests - ARM reference validation and QEMU (frugal, 90% of validation)
  linux-test:
    runs-on: ubuntu-22.04
    name: Linux Tests (ARM Reference + QEMU)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache test binaries
      uses: actions/cache@v4
      with:
        path: build/
        key: linux-build-${{ hashFiles('**/decode.c', '**/decode.h') }}
        restore-keys: |
          linux-build-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          qemu-user-static \
          valgrind \
          clang-tidy

    - name: Run ARM Reference Validation
      run: |
        echo "========================================"
        echo "ARM Reference Validation (DDI 0487)"
        echo "========================================"
        bash tests/aarch64/tools/reference-check.sh 2>&1 | tee arm-reference.log
      continue-on-error: false

    - name: Compile and Run Decoder Tests
      run: |
        echo "========================================"
        echo "Decoder Unit Tests"
        echo "========================================"

        mkdir -p build

        gcc -I. -Iemu -Ikernel \
          tests/aarch64/decoder_test.c \
          emu/aarch64/decode.c \
          -o build/decoder_test

        ./build/decoder_test 2>&1 | tee decoder_test.log || true

    - name: Compile and Run DP Register Tests
      run: |
        echo "========================================"
        echo "Data Processing Register Tests"
        echo "========================================"

        gcc -I. -Iemu -Ikernel \
          tests/aarch64/test-dp-reg.c \
          emu/aarch64/decode.c \
          -o build/test-dp-reg

        ./build/test-dp-reg 2>&1 | tee test-dp-reg.log

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-test-results
        path: |
          arm-reference.log
          decoder_test.log
          test-dp-reg.log
          tests/aarch64/e2e/results/

    - name: Summary
      if: always()
      run: |
        echo "========================================"
        echo "Test Summary"
        echo "========================================"
        echo "ARM Reference: $(grep -c '✅' arm-reference.log || echo 0) passed"
        echo "Decoder tests: $(grep -c 'PASS' decoder_test.log || echo 0) passed"
        echo "DP Reg tests: $(grep -c 'PASS' test-dp-reg.log || echo 0) passed"

  # Docker build - Containerized testing
  docker-test:
    runs-on: ubuntu-22.04
    name: Docker Test Suite

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Linux test image
      run: |
        docker build -f Dockerfile.linux-test -t ish-linux-tester .

    - name: Run tests in Docker
      run: |
        docker run --rm \
          -v $(pwd)/tests/aarch64/results:/ish/tests/aarch64/results \
          -v $(pwd)/build:/ish/build \
          ish-linux-tester 2>&1 | tee docker-test.log

    - name: Upload Docker results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-test-results
        path: |
          docker-test.log
          tests/aarch64/results/
          build/*.log

  # Final summary job
  summary:
    needs: [linux-test, docker-test]
    if: always()
    runs-on: ubuntu-22.04
    name: Build Summary

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Generate summary
      run: |
        echo "# iSH Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Linux Tests | ${{ needs.linux-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Tests | ${{ needs.docker-test.result }} |" >> $GITHUB_STEP_SUMMARY
