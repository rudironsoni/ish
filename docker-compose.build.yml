# Docker Compose for iSH dual-platform build system
# Usage: docker-compose -f docker-compose.build.yml up

version: '3.8'

services:
  # Linux test environment (ARM reference validation, QEMU tests)
  linux-tester:
    build:
      context: .
      dockerfile: Dockerfile
      target: tester
    image: ish-linux-tester
    container_name: ish-linux-tests
    volumes:
      - ./tests/aarch64/results:/ish/tests/aarch64/results
      - ./build:/ish/build
    working_dir: /ish
    # Uses default CMD from Dockerfile (run-tests.sh)

  # macOS cross-compile environment (requires SDK)
  osxcross-builder:
    build:
      context: .
      dockerfile: Dockerfile.osxcross
    image: ish-osxcross-builder
    container_name: ish-osxcross
    volumes:
      - .:/ish
      - osxcross-build:/ish/build
    working_dir: /ish
    command: |
      bash -c "
        if [ ! -f /opt/osxcross/target/bin/o64-clang ]; then
          echo 'ERROR: osxcross not properly configured'
          echo 'macOS SDK not found - cross-compilation disabled'
          echo ''
          echo 'To enable:'
          echo '1. Extract SDK from Xcode on macOS'
          echo '2. Place MacOSX14.0.sdk.tar.xz in project root'
          echo '3. Rebuild docker image'
          exit 1
        fi

        echo 'Building iSH CLI for macOS...'
        mkdir -p build/macos

        o64-clang -o build/macos/ish-cli \
          -I. -Iemu -Ikernel \
          -framework Foundation \
          -framework CoreFoundation \
          main.c \
          emu/aarch64/*.c \
          kernel/aarch64/*.c \
          -DCLI_ONLY=1 \
          2>&1 | tee build/macos/build.log

        echo 'Build complete'
        ls -la build/macos/
      "
    profiles: ["cross-compile"]  # Only run when explicitly requested

volumes:
  osxcross-build:
    driver: local
